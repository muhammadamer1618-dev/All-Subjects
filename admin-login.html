<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>دخول المشرف - مدارس الفلاح الأهلية</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
body{font-family:Calibri;background:#f4f4f4;margin:0;padding:20px}
.container{max-width:400px;margin:60px auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 0 10px rgba(0,0,0,0.15);text-align:center}
h1{color:#1976d2;margin-bottom:5px}
h2{color:#d32f2f;margin-top:0;font-size:18px}
label{display:block;margin-top:10px;font-weight:bold;text-align:right}
input{padding:10px;font-size:16px;width:100%;border-radius:8px;border:1px solid #999;box-sizing:border-box;margin-top:5px}
button{margin-top:15px;padding:10px 20px;border:none;border-radius:8px;background:#1976d2;color:#fff;font-size:17px;font-weight:bold;cursor:pointer;width:100%}
button:hover{opacity:0.9}
.msg{margin-top:10px;font-size:14px;color:#d32f2f;min-height:20px}
.small{margin-top:15px;font-size:13px;color:#555}
</style>
</head>
<body>

<div class="container">
  <h1>مدارس الفلاح الأهلية</h1>
  <h2>دخول لوحة المشرف</h2>

  <label>اسم المستخدم</label>
  <input id="admin_user" placeholder="مثال: admin1">

  <label>كلمة المرور</label>
  <input id="admin_pass" type="password" placeholder="••••••">

  <button onclick="loginAdmin()">دخول المشرف</button>

  <div id="msg" class="msg"></div>

  <div class="small">
    يجب إضافة بيانات المشرف في Firestore في مجموعة <b>admins</b>.
  </div>
</div>

<script>
var firebaseConfig={
  apiKey:"AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
  authDomain:"all-subjects-14322.firebaseapp.com",
  projectId:"all-subjects-14322",
  storageBucket:"all-subjects-14322.firebasestorage.app",
  messagingSenderId:"813955287168",
  appId:"1:813955287168:web:07efa7dde95b117b9bbe65"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();

async function loginAdmin(){
  var msg=document.getElementById("msg");
  msg.innerText="";

  var user=document.getElementById("admin_user").value.trim();
  var pass=document.getElementById("admin_pass").value.trim();

  if(!user || !pass){
    msg.innerText="أدخل اسم المستخدم وكلمة المرور";
    return;
  }

  try{
    var doc=await db.collection("admins").doc(user).get();
    if(!doc.exists){
      msg.innerText="بيانات الدخول غير صحيحة";
      return;
    }
    var data=doc.data()||{};
    if(data.password!==pass){
      msg.innerText="بيانات الدخول غير صحيحة";
      return;
    }

    localStorage.setItem("admin_id", user);
    localStorage.setItem("admin_name", data.name || "");
    location="admin.html";
  }catch(e){
    console.log(e);
    msg.innerText="خطأ في الاتصال بالقاعدة";
  }
}
</script>

</body>
</html>
