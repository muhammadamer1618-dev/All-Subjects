<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إعداد المواد - مدارس الفلاح الأهلية</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
body{font-family:Calibri;background:#eef2f7;margin:0}
.header{background:#1976d2;color:#fff;text-align:center;padding:15px}
.header h1{margin:0;font-size:24px}
.header h2{margin:5px 0 0;font-size:18px;color:#ffeb3b}

.container{max-width:900px;margin:25px auto;padding:15px}
.box{background:#fff;border-radius:10px;padding:20px;margin-bottom:20px;box-shadow:0 0 8px rgba(0,0,0,0.1)}

h3{margin-top:0;color:#1976d2}
label{display:block;margin-top:10px;font-weight:bold}
input,select,button{
  font-family:Calibri;
  font-size:16px;
  padding:8px;
  border-radius:6px;
  border:1px solid #999;
  box-sizing:border-box;
}
input,select{width:100%}
button{cursor:pointer;font-weight:bold;border:none}
.btn-primary{background:#1976d2;color:#fff}
.btn-secondary{background:#555;color:#fff}
.btn-danger{background:#d32f2f;color:#fff}

table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ccc;text-align:center;padding:8px}
th{background:#1976d2;color:#fff}
.small-btn{padding:4px 8px;font-size:12px;border-radius:5px}
</style>
</head>

<body>

<div class="header">
  <h1>مدارس الفلاح الأهلية</h1>
  <h2>إعداد المواد لكل صف</h2>
</div>

<div class="container">

  <div class="box">
    <h3>اختيار الصف</h3>
    <label>اختر الصف لإعداد مواده</label>
    <select id="grade_select" onchange="loadSubjects()"></select>
  </div>

  <div class="box">
    <h3>المواد الحالية</h3>

    <table>
      <thead>
        <tr>
          <th>اسم المادة</th>
          <th>الدرجة النهائية</th>
          <th>إزالة</th>
        </tr>
      </thead>
      <tbody id="subjects_body"></tbody>
    </table>

    <h3 style="margin-top:20px">إضافة مادة جديدة</h3>

    <label>اسم المادة</label>
    <input id="sub_name" placeholder="مثال: رياضيات">

    <label>الدرجة النهائية</label>
    <input id="sub_full" type="number" placeholder="مثال: 100">

    <button class="btn-primary" style="margin-top:10px" onclick="addSubject()">إضافة مادة</button>
    <button class="btn-secondary" style="margin-top:10px" onclick="saveSubjects()">حفظ جميع المواد</button>
  </div>

  <div class="box">
    <button class="btn-secondary" onclick="location='admin.html'">رجوع للوحة المشرف</button>
  </div>

</div>

<script>
var firebaseConfig={
  apiKey:"AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
  authDomain:"all-subjects-14322.firebaseapp.com",
  projectId:"all-subjects-14322",
  storageBucket:"all-subjects-14322.firebasestorage.app",
  messagingSenderId:"813955287168",
  appId:"1:813955287168:web:07efa7dde95b117b9bbe65"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();

var gradesList=[
  "1 ابتدائي","2 ابتدائي","3 ابتدائي","4 ابتدائي","5 ابتدائي","6 ابتدائي",
  "1 متوسط","2 متوسط","3 متوسط",
  "1 ثانوي","2 ثانوي","3 ثانوي"
];

var currentGrade="";
var subjects=[];

// تعبئة قائمة الصفوف
function initGrades(){
  var sel=document.getElementById("grade_select");
  gradesList.forEach(g=>{
    var o=document.createElement("option");
    o.value=g; o.textContent=g;
    sel.appendChild(o);
  });
  currentGrade=gradesList[0];
  sel.value=currentGrade;
  loadSubjects();
}

// تحميل المواد من فيربيز
async function loadSubjects(){
  currentGrade=document.getElementById("grade_select").value;
  let doc=await db.collection("settings").doc("subjects_"+currentGrade).get();
  subjects=[];

  if(doc.exists){
    subjects=doc.data().subjects||[];
  }

  displaySubjects();
}

function displaySubjects(){
  let tbody=document.getElementById("subjects_body");
  tbody.innerHTML="";

  if(subjects.length===0){
    tbody.innerHTML="<tr><td colspan='3'>لا توجد مواد لهذا الصف</td></tr>";
    return;
  }

  subjects.forEach((sub,i)=>{
    let tr=document.createElement("tr");
    tr.innerHTML=
      "<td>"+sub.name+"</td>"+
      "<td>"+sub.fullMark+"</td>"+
      "<td><button class='small-btn btn-danger' onclick='removeSubject("+i+")'>حذف</button></td>";
    tbody.appendChild(tr);
  });
}

function removeSubject(i){
  subjects.splice(i,1);
  displaySubjects();
}

function addSubject(){
  let name=document.getElementById("sub_name").value.trim();
  let full=document.getElementById("sub_full").value.trim();

  if(!name||!full){
    alert("أدخل اسم المادة والدرجة النهائية");
    return;
  }

  subjects.push({name:name,fullMark:Number(full)});
  document.getElementById("sub_name").value="";
  document.getElementById("sub_full").value="";
  displaySubjects();
}

// حفظ المواد في فيربيز
async function saveSubjects(){
  if(!currentGrade)return;

  await db.collection("settings").doc("subjects_"+currentGrade).set({
    subjects:subjects
  });

  alert("تم حفظ المواد للصف "+currentGrade);
}
initGrades();
</script>

</body>
</html>
