<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إعدادات المواد والاختبار</title>

<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<style>
body{
  font-family:Calibri;
  background:#f4f4f4;
  margin:0;
  padding:0;
}
.header{
  background:#1976d2;
  color:#fff;
  text-align:center;
  padding:15px;
}
.header h1{margin:0;font-size:24px}
.header h2{margin:5px 0 0;font-size:18px;color:#ffeb3b}

.container{
  max-width:900px;
  margin:20px auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
  box-shadow:0 0 8px rgba(0,0,0,0.15);
}

label{display:block;margin-top:10px;font-weight:bold;color:#1976d2}
input,select,button{
  width:100%;
  padding:10px;
  margin-top:5px;
  border-radius:6px;
  border:1px solid #aaa;
  font-family:Calibri;
  font-size:16px;
  box-sizing:border-box;
}
button{cursor:pointer;font-weight:bold;border:none}
.btn-primary{background:#1976d2;color:#fff}
.btn-danger{background:#d32f2f;color:#fff}
.btn-secondary{background:#757575;color:#fff}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
  font-size:15px;
}
th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}
th{
  background:#1976d2;
  color:white;
}
.small-btn{
  padding:5px 10px;
  font-size:12px;
  border-radius:5px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <h1>مدارس الفلاح الأهلية</h1>
  <h2>إعداد مواد الصف ونوع الاختبار</h2>
</div>

<div class="container">

  <label>نوع الاختبار</label>
  <input id="exam_type" placeholder="مثال: اختبار الفترة الأولى">

  <button class="btn-primary" onclick="saveExamType()">حفظ نوع الاختبار</button>

  <hr>

  <label>اختر الصف</label>
  <select id="grade_select" onchange="loadSubjects()">
  </select>

  <hr>

  <h3 style="color:#1976d2;margin-top:5px;">مواد الصف</h3>

  <table>
    <thead>
      <tr>
        <th>المادة</th>
        <th>الدرجة النهائية</th>
        <th>إزالة</th>
      </tr>
    </thead>
    <tbody id="subjects_body"></tbody>
  </table>

  <button class="btn-secondary" onclick="addRow()">إضافة مادة</button>
  <button class="btn-primary" onclick="saveSubjects()">حفظ المواد</button>
  <button class="btn-danger" onclick="deleteAllSubjects()">حذف جميع مواد الصف</button>

  <hr>

  <label>استيراد مواد من Excel</label>
  <input type="file" id="excel_file" onchange="importExcel()">

  <hr>

  <button class="btn-secondary" onclick="location='admin.html'">رجوع للوحة المشرف</button>

</div>


<script>
/* ---------------- Firebase Init ---------------- */
var firebaseConfig = {
  apiKey:"AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
  authDomain:"all-subjects-14322.firebaseapp.com",
  projectId:"all-subjects-14322",
  storageBucket:"all-subjects-14322.firebasestorage.app",
  messagingSenderId:"813955287168",
  appId:"1:813955287168:web:07efa7dde95b117b9bbe65"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();

/* ---------------- Grades List ---------------- */

var gradesList=[
  "1 ابتدائي","2 ابتدائي","3 ابتدائي",
  "4 ابتدائي","5 ابتدائي","6 ابتدائي",
  "1 متوسط","2 متوسط","3 متوسط",
  "1 ثانوي","2 ثانوي","3 ثانوي"
];

/* ---------------- Init Grades ---------------- */
function initGrades(){
  var g=document.getElementById("grade_select");
  gradesList.forEach(x=>{
    var o=document.createElement("option");
    o.value=x;o.textContent=x;
    g.appendChild(o);
  });
}

/* ---------------- Load Exam Type ---------------- */
async function loadExamType(){
  let doc = await db.collection("settings").doc("general").get();
  if(doc.exists){
    document.getElementById("exam_type").value = doc.data().examType || "";
  }
}

/* ---------------- Save Exam Type ---------------- */
async function saveExamType(){
  let exam = document.getElementById("exam_type").value.trim();
  await db.collection("settings").doc("general").set({
    examType: exam
  },{merge:true});
  alert("تم حفظ نوع الاختبار");
}

/* ---------------- Load Subjects ---------------- */
async function loadSubjects(){
  let grade = document.getElementById("grade_select").value;
  let body = document.getElementById("subjects_body");
  body.innerHTML = "<tr><td colspan='3'>جاري التحميل...</td></tr>";

  let doc = await db.collection("settings").doc("subjects_"+grade).get();

  body.innerHTML = "";

  if(doc.exists && doc.data().subjects){
    doc.data().subjects.forEach(sub=>{
      addRow(sub.name, sub.fullMark);
    });
  }
}

/* ---------------- Add Row ---------------- */
function addRow(name="", full=""){
  let body=document.getElementById("subjects_body");
  let tr=document.createElement("tr");
  tr.innerHTML=`
    <td><input class="sub-name" value="${name}"></td>
    <td><input type="number" class="sub-full" value="${full}"></td>
    <td><button class="small-btn btn-danger" onclick="this.closest('tr').remove()">حذف</button></td>
  `;
  body.appendChild(tr);
}

/* ---------------- Save Subjects ---------------- */
async function saveSubjects(){
  let grade=document.getElementById("grade_select").value;
  let rows=document.querySelectorAll("#subjects_body tr");
  let arr=[];

  rows.forEach(r=>{
    let name=r.querySelector(".sub-name").value.trim();
    let full=Number(r.querySelector(".sub-full").value)||0;
    if(name) arr.push({name:name, fullMark:full});
  });

  await db.collection("settings").doc("subjects_"+grade).set({
    subjects: arr
  });

  alert("تم حفظ مواد الصف");
}

/* ---------------- Delete All Subjects ---------------- */
async function deleteAllSubjects(){
  if(!confirm("هل تريد حذف جميع المواد لهذا الصف؟"))return;
  let grade=document.getElementById("grade_select").value;
  await db.collection("settings").doc("subjects_"+grade).delete();
  document.getElementById("subjects_body").innerHTML="";
  alert("تم حذف كل المواد");
}

/* ---------------- Excel Import ---------------- */
function importExcel(){
  let file=document.getElementById("excel_file").files[0];
  if(!file)return;

  let reader=new FileReader();
  reader.onload=function(e){
    let data=new Uint8Array(e.target.result);
    let wb=XLSX.read(data,{type:"array"});
    let ws=wb.Sheets[wb.SheetNames[0]];
    let rows=XLSX.utils.sheet_to_json(ws,{header:1});

    document.getElementById("subjects_body").innerHTML="";

    rows.forEach(r=>{
      if(r[0] && r[1]){
        addRow(r[0], r[1]);
      }
    });
  };

  reader.readAsArrayBuffer(file);
}

/* ---------------- Start ---------------- */
initGrades();
loadExamType();
loadSubjects();
</script>

</body>
</html>
