<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة المشرف - مدارس الفلاح الأهلية</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<style>
body{font-family:Calibri;background:#f4f4f4;margin:0}
.header{background:#1976d2;color:#fff;text-align:center;padding:15px}
.header h1{margin:0;font-size:24px}
.header h2{margin:5px 0 0;font-size:18px;color:#ffeb3b}
.container{max-width:1200px;margin:20px auto;padding:10px}
.box{background:#fff;border-radius:10px;padding:15px;margin-bottom:15px;box-shadow:0 0 8px rgba(0,0,0,0.1)}
h3{margin-top:0;color:#1976d2}
label{display:block;margin-top:5px}
input,select,button{font-family:Calibri;font-size:15px;padding:7px;margin-top:5px;border-radius:6px;border:1px solid #999;box-sizing:border-box}
input,select{width:100%}
button{cursor:pointer;font-weight:bold;border:none}
.btn-primary{background:#1976d2;color:#fff}
.btn-secondary{background:#757575;color:#fff}
.btn-danger{background:#d32f2f;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px}
.col-3{flex:1 1 23%}
.col-4{flex:1 1 30%}
.col-6{flex:1 1 48%}
.col-12{flex:1 1 100%}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
th,td{border:1px solid #ccc;text-align:center;padding:6px}
th{background:#1976d2;color:#fff}
tr:nth-child(even){background:#f9f9f9}
.small-btn{padding:4px 8px;font-size:12px;border-radius:5px}
.sub-table{margin-top:8px;border:1px solid #ccc;border-radius:6px}
.sub-table th{background:#42a5f5}
.badge{display:inline-block;padding:2px 6px;border-radius:10px;font-size:11px;background:#e3f2fd;color:#0d47a1}
.info{font-size:13px;color:#555;margin-top:5px}
</style>
</head>
<body>

<div class="header">
  <h1>مدارس الفلاح الأهلية</h1>
  <h2 id="header_exam">لوحة المشرف - نظام رصد الدرجات</h2>
</div>

<div class="container">

  <!-- إدارة الطلاب -->
  <div class="box">
    <h3>إدارة الطلاب</h3>

    <div class="row">
      <div class="col-3"><label>بحث بالاسم</label><input id="filter_name" placeholder="جزء من الاسم"></div>
      <div class="col-3"><label>بحث بالكود</label><input id="filter_code" placeholder="كود الطالب"></div>
      <div class="col-3" style="display:flex;align-items:flex-end">
        <button class="btn-primary" style="width:100%" onclick="loadStudents()">بحث</button>
      </div>
    </div>

    <hr>

    <div class="row">
      <div class="col-3"><label>كود الطالب</label><input id="new_code"></div>
      <div class="col-3"><label>اسم الطالب</label><input id="new_name"></div>
      <div class="col-3"><label>الصف</label><select id="new_grade"></select></div>
      <div class="col-3"><label>الشعبة</label>
        <select id="new_section">
          <option>أ</option><option>ب</option><option>ج</option><option>د</option><option>هـ</option>
        </select>
      </div>
    </div>

    <button class="btn-primary" onclick="addNewStudent()">إضافة طالب</button>

    <button class="btn-danger" onclick="deleteAllStudents()" style="margin-top:10px;width:100%">
      حذف جميع الطلاب
    </button>

    <hr>

    <label>استيراد الطلاب من ملف Excel (الترتيب: code - name - grade - section)</label>
    <input type="file" id="students_file" accept=".xlsx,.xls">
    <button class="btn-secondary" style="margin-top:5px" onclick="importStudentsFromExcel()">استيراد الطلاب</button>

    <div class="info">
      المواد يتم إعدادها من صفحة الإعدادات لكل صف مرة واحدة فقط، ويتم هنا رصد درجات الطلاب فقط.
    </div>
  </div>

  <!-- كشف الطلاب -->
  <div class="box">
    <h3>كشف الطلاب (ملخص)</h3>

    <div style="margin-bottom:8px;font-size:14px">
      <span>نوع الاختبار: </span>
      <span id="current_exam_type" class="badge">—</span>
      <button class="btn-secondary" style="float:left" onclick="location='settings.html'">إعداد المواد والاختبار</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>الكود</th>
          <th>الاسم</th>
          <th>الصف</th>
          <th>الشعبة</th>
          <th>عدد المواد</th>
          <th>الإجمالي</th>
          <th>التقدير العام</th>
        </tr>
      </thead>
      <tbody id="students_body"></tbody>
    </table>
  </div>

  <!-- رصد مجمع لصف كامل -->
  <div class="box">
    <h3>رصد درجات صف كامل (جدول أفقي مثل نور)</h3>

    <div class="row">
      <div class="col-3">
        <label>الصف</label>
        <select id="marks_grade"></select>
      </div>
      <div class="col-3">
        <label>الشعبة</label>
        <select id="marks_section">
          <option value="">كل الشعب</option>
          <option>أ</option><option>ب</option><option>ج</option><option>د</option><option>هـ</option>
        </select>
      </div>
      <div class="col-3" style="display:flex;align-items:flex-end">
        <button class="btn-primary" style="width:100%" onclick="loadGradeMarks()">عرض طلاب الصف للرصد</button>
      </div>
    </div>

    <div id="grade_marks_container" style="margin-top:15px;overflow-x:auto;">
      <table id="grade_marks_table" style="min-width:600px;display:none;">
        <thead id="grade_marks_head"></thead>
        <tbody id="grade_marks_body"></tbody>
      </table>
    </div>

    <button id="save_grade_marks_btn" class="btn-primary" style="margin-top:10px;display:none;" onclick="saveGradeMarks()">
      حفظ درجات الصف بالكامل
    </button>
  </div>

  <div class="box">
    <button class="btn-secondary" onclick="exportToExcel()">تصدير Excel</button>
    <button class="btn-secondary" onclick="location='index.html'">الصفحة الرئيسية</button>
    <button class="btn-secondary" onclick="location='student.html'">صفحة الطالب</button>
  </div>

</div>

<script>
var firebaseConfig={
  apiKey:"AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
  authDomain:"all-subjects-14322.firebaseapp.com",
  projectId:"all-subjects-14322",
  storageBucket:"all-subjects-14322.firebasestorage.app",
  messagingSenderId:"813955287168",
  appId:"1:813955287168:web:07efa7dde95b117b9bbe65"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();

var gradesList=[
  "1 ابتدائي","2 ابتدائي","3 ابتدائي","4 ابتدائي","5 ابتدائي","6 ابتدائي",
  "1 متوسط","2 متوسط","3 متوسط",
  "1 ثانوي","2 ثانوي","3 ثانوي"
];

var examType="";
var studentsCache=[];
var studentsByCode={};
var subjectsCacheByGrade={};

const gradeOrder={
  "1 ابتدائي":1,"2 ابتدائي":2,"3 ابتدائي":3,
  "4 ابتدائي":4,"5 ابتدائي":5,"6 ابتدائي":6,
  "1 متوسط":7,"2 متوسط":8,"3 متوسط":9,
  "1 ثانوي":10,"2 ثانوي":11,"3 ثانوي":12
};

function calcRating(m,f){
  m=Number(m);f=Number(f);
  if(!m||!f)return"";
  var p=(m/f)*100;
  if(p>=90)return"ممتاز";
  if(p>=80)return"جيد جدًا";
  if(p>=70)return"جيد";
  if(p>=60)return"مقبول";
  return"ضعيف";
}

// إعداد نوع الاختبار
async function loadSettings(){
  try{
    let set=await db.collection("settings").doc("general").get();
    if(set.exists){
      examType=set.data().examType||"";
      document.getElementById("current_exam_type").innerText=examType||"—";
      if(examType){
        document.getElementById("header_exam").innerText="لوحة المشرف - "+examType;
      }
    }
  }catch(e){console.log(e);}
}

// تهيئة القوائم الخاصة بالصفوف
function initGrades(){
  var g1=document.getElementById("new_grade");
  var g2=document.getElementById("marks_grade");
  gradesList.forEach(x=>{
    let o1=document.createElement("option");o1.value=x;o1.textContent=x;
    let o2=document.createElement("option");o2.value=x;o2.textContent=x;
    g1.appendChild(o1);g2.appendChild(o2);
  });
}

// إضافة طالب جديد
async function addNewStudent(){
  let code=document.getElementById("new_code").value.trim();
  let name=document.getElementById("new_name").value.trim();
  let grade=document.getElementById("new_grade").value;
  let section=document.getElementById("new_section").value;

  if(!code||!name){alert("أدخل كود واسم الطالب");return;}

  await db.collection("students").doc(code).set({
    code, name, grade, section,
    examType,
    subjects:{}
  },{merge:true});

  alert("تم إضافة الطالب");
  document.getElementById("new_code").value="";
  document.getElementById("new_name").value="";
  loadStudents();
}

// حذف جميع الطلاب
async function deleteAllStudents(){
  if(!confirm("هل تريد حذف جميع الطلاب؟"))return;
  let snap=await db.collection("students").get();
  let batch=db.batch();
  snap.forEach(doc=>batch.delete(doc.ref));
  await batch.commit();
  alert("تم حذف جميع الطلاب");
  loadStudents();
}

// تحميل الطلاب (ملخص)
async function loadStudents(){
  let fname=document.getElementById("filter_name").value.trim();
  let fcode=document.getElementById("filter_code").value.trim();
  let tbody=document.getElementById("students_body");

  tbody.innerHTML="<tr><td colspan='7'>جاري التحميل...</td></tr>";

  let snap=await db.collection("students").get();
  studentsCache=[];
  studentsByCode={};

  snap.forEach(doc=>{
    let s=doc.data();
    studentsCache.push(s);
    if(s.code)studentsByCode[s.code]=s;
  });

  studentsCache.sort((a,b)=>{
    let g1=gradeOrder[a.grade]||999;
    let g2=gradeOrder[b.grade]||999;
    if(g1!==g2)return g1-g2;
    return (a.name||"").localeCompare(b.name||"","ar");
  });

  let filtered=studentsCache.filter(s=>{
    if(fcode && (!s.code || s.code.indexOf(fcode)===-1))return false;
    if(fname && (!s.name || s.name.indexOf(fname)===-1))return false;
    return true;
  });

  tbody.innerHTML="";
  if(filtered.length===0){
    tbody.innerHTML="<tr><td colspan='7'>لا توجد بيانات</td></tr>";
    return;
  }

  filtered.forEach(s=>{
    let total=0,full=0,count=0;
    if(s.subjects){
      count=Object.keys(s.subjects).length;
      Object.values(s.subjects).forEach(v=>{
        total+=Number(v.mark)||0;
        full+=Number(v.fullMark)||0;
      });
    }
    let rating=full?calcRating(total,full):"—";

    let tr=document.createElement("tr");
    tr.innerHTML=
      "<td>"+(s.code||"")+"</td>"+
      "<td>"+(s.name||"")+"</td>"+
      "<td>"+(s.grade||"")+"</td>"+
      "<td>"+(s.section||"")+"</td>"+
      "<td>"+count+"</td>"+
      "<td>"+total+"/"+full+"</td>"+
      "<td>"+rating+"</td>";
    tbody.appendChild(tr);
  });
}

// كاش لمواد الصف
async function getSubjectsTemplateForGrade(grade){
  if(subjectsCacheByGrade[grade])return subjectsCacheByGrade[grade];
  let doc=await db.collection("settings").doc("subjects_"+grade).get();
  if(doc.exists){
    subjectsCacheByGrade[grade]=doc.data().subjects||[];
    return subjectsCacheByGrade[grade];
  }
  return [];
}

// رصد صف كامل: تحميل الجدول الأفقي
async function loadGradeMarks(){
  let grade=document.getElementById("marks_grade").value;
  let section=document.getElementById("marks_section").value;

  let table=document.getElementById("grade_marks_table");
  let head=document.getElementById("grade_marks_head");
  let body=document.getElementById("grade_marks_body");
  let btn=document.getElementById("save_grade_marks_btn");

  head.innerHTML="";
  body.innerHTML="";
  table.style.display="none";
  btn.style.display="none";

  if(!grade){
    alert("اختر الصف أولاً");
    return;
  }

  let subjects=await getSubjectsTemplateForGrade(grade);
  if(!subjects.length){
    alert("لا توجد مواد محفوظة لهذا الصف في صفحة الإعدادات");
    return;
  }

  let snap=await db.collection("students").where("grade","==",grade).get();
  let students=[];
  snap.forEach(doc=>{
    let s=doc.data();
    if(section && s.section!==section)return;
    students.push(s);
  });

  if(!students.length){
    alert("لا يوجد طلاب لهذا الصف/الشعبة");
    return;
  }

  // ترتيب الطلاب بالاسم
  students.sort((a,b)=>(a.name||"").localeCompare(b.name||"","ar"));

  // بناء رأس الجدول
  let trHead=document.createElement("tr");
  trHead.innerHTML="<th>الكود</th><th>اسم الطالب</th>";
  subjects.forEach(sub=>{
    trHead.innerHTML+="<th>"+sub.name+" (النهائية)</th><th>"+sub.name+" (درجة)</th>";
  });
  head.appendChild(trHead);

  // بناء الصفوف
  students.forEach(st=>{
    let tr=document.createElement("tr");
    let rowHtml="<td>"+(st.code||"")+"</td><td>"+(st.name||"")+"</td>";
    subjects.forEach(sub=>{
      let full=sub.fullMark||0;
      let existing=st.subjects && st.subjects[sub.name];
      let mark=existing ? (existing.mark||"") : "";
      let safeSubject=sub.name.replace(/'/g,"&#39;");
      rowHtml+="<td>"+full+"</td>";
      rowHtml+="<td><input type='number' class='gm-mark' data-code='"+(st.code||"")+"' data-subject='"+safeSubject+"' data-full='"+full+"' style='width:70px' value='"+mark+"'></td>";
    });
    tr.innerHTML=rowHtml;
    body.appendChild(tr);
  });

  table.style.display="table";
  btn.style.display="inline-block";
}

// حفظ درجات الصف بالكامل من الجدول الأفقي
async function saveGradeMarks(){
  let inputs=document.querySelectorAll(".gm-mark");
  if(!inputs.length){
    alert("لا توجد درجات لإدخالها");
    return;
  }

  let byCode={};

  inputs.forEach(inp=>{
    let code=inp.getAttribute("data-code");
    let subject=inp.getAttribute("data-subject");
    let full=Number(inp.getAttribute("data-full"))||0;
    let markVal=inp.value.trim();
    let mark=markVal==="" ? 0 : Number(markVal);
    if(!code || !subject)return;

    if(!byCode[code]) byCode[code]={};
    byCode[code][subject]={fullMark:full,mark:mark,rating:calcRating(mark,full)};
  });

  let batch=db.batch();
  Object.keys(byCode).forEach(code=>{
    let ref=db.collection("students").doc(code);
    batch.set(ref,{
      subjects:byCode[code],
      examType:examType||""
    },{merge:true});
  });

  await batch.commit();
  alert("تم حفظ درجات الصف بنجاح");
  loadStudents();
}

// تصدير ملخص الطلاب إلى Excel
function exportToExcel(){
  let rows=[["الكود","الاسم","الصف","الشعبة","عدد المواد","الإجمالي","التقدير العام"]];
  document.querySelectorAll("#students_body tr").forEach(tr=>{
    if(tr.children.length===7){
      rows.push([
        tr.children[0].innerText,
        tr.children[1].innerText,
        tr.children[2].innerText,
        tr.children[3].innerText,
        tr.children[4].innerText,
        tr.children[5].innerText,
        tr.children[6].innerText
      ]);
    }
  });
  let ws=XLSX.utils.aoa_to_sheet(rows);
  let wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"students");
  XLSX.writeFile(wb,"students.xlsx");
}

// استيراد الطلاب من Excel
async function importStudentsFromExcel(){
  let input=document.getElementById("students_file");
  let file=input.files[0];
  if(!file){
    alert("اختر ملف الطلاب أولاً");
    return;
  }

  let reader=new FileReader();
  reader.onload=async function(e){
    try{
      let data=new Uint8Array(e.target.result);
      let wb=XLSX.read(data,{type:"array"});
      let ws=wb.Sheets[wb.SheetNames[0]];
      let rows=XLSX.utils.sheet_to_json(ws,{header:1});

      if(!rows.length){
        alert("الملف فارغ");
        return;
      }

      let batch=db.batch();
      let count=0;

      rows.forEach((r,index)=>{
        if(index===0) return; // لو في هيدر
        let code=(r[0]||"").toString().trim();
        let name=(r[1]||"").toString().trim();
        let grade=(r[2]||"").toString().trim();
        let section=(r[3]||"").toString().trim();
        if(!code || !name)return;

        let ref=db.collection("students").doc(code);
        batch.set(ref,{
          code:code,
          name:name,
          grade:grade,
          section:section,
          examType:examType||"",
          subjects:{}
        },{merge:true});
        count++;
      });

      if(count===0){
        alert("لم يتم العثور على بيانات طلاب صالحة في الملف");
        return;
      }

      await batch.commit();
      alert("تم استيراد "+count+" طالبًا بنجاح");
      input.value="";
      loadStudents();
    }catch(err){
      console.log(err);
      alert("خطأ أثناء قراءة الملف");
    }
  };
  reader.readAsArrayBuffer(file);
}

// تشغيل مبدئي
initGrades();
loadSettings();
loadStudents();
</script>

</body>
</html>
