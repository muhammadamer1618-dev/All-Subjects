<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة المشرف - مدارس الفلاح الأهلية</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
body{font-family:Calibri;background:#f4f4f4;margin:0}
.header{background:#1976d2;color:#fff;text-align:center;padding:15px}
.header h1{margin:0;font-size:24px}
.header h2{margin:5px 0 0;font-size:18px;color:#ffeb3b}
.container{max-width:1200px;margin:20px auto;padding:10px}
.box{background:#fff;border-radius:10px;padding:15px;margin-bottom:15px;box-shadow:0 0 8px rgba(0,0,0,0.1)}
h3{margin-top:0;color:#1976d2}
label{display:block;margin-top:5px}
input,select,button{font-family:Calibri;font-size:15px;padding:7px;margin-top:5px;border-radius:6px;border:1px solid #999;box-sizing:border-box}
input,select{width:100%}
button{cursor:pointer;font-weight:bold;border:none}
.btn-primary{background:#1976d2;color:#fff}
.btn-secondary{background:#757575;color:#fff}
.btn-danger{background:#d32f2f;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px}
.col-2{flex:1 1 18%}
.col-3{flex:1 1 23%}
.col-4{flex:1 1 30%}
.col-6{flex:1 1 48%}
.col-12{flex:1 1 100%}
@media(max-width:768px){.col-2,.col-3,.col-4,.col-6{flex:1 1 100%}}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
th,td{border:1px solid #ccc;text-align:center;padding:6px}
th{background:#1976d2;color:#fff}
tr:nth-child(even){background:#f9f9f9}
.small-btn{padding:4px 8px;font-size:12px;border-radius:5px}
.badge{display:inline-block;padding:2px 6px;border-radius:10px;font-size:11px;background:#e3f2fd;color:#0d47a1}
</style>
</head>
<body>

<div class="header">
  <h1>مدارس الفلاح الأهلية</h1>
  <h2>لوحة المشرف - كشف الطلاب ورصد الدرجات (مشابه لنظام نور)</h2>
</div>

<div class="container">

  <div class="box">
    <h3>إدارة الطلاب</h3>
    <div class="row">
      <div class="col-3"><label>بحث بالاسم</label><input id="filter_name" placeholder="اكتب جزء من الاسم"></div>
      <div class="col-3"><label>بحث بالكود</label><input id="filter_code" placeholder="كود الطالب"></div>
      <div class="col-2" style="display:flex;align-items:flex-end;"><button class="btn-primary" style="width:100%" onclick="loadStudents()">بحث</button></div>
    </div>

    <div class="row" style="margin-top:10px;border-top:1px dashed #ccc;padding-top:10px;">
      <div class="col-3"><label>كود الطالب</label><input id="new_code"></div>
      <div class="col-3"><label>اسم الطالب</label><input id="new_name"></div>
      <div class="col-3"><label>الصف</label><select id="new_grade"></select></div>
      <div class="col-3"><label>الشعبة</label><select id="new_section"><option>أ</option><option>ب</option><option>ج</option><option>د</option></select></div>
      <div class="col-3"><button class="btn-secondary" style="width:100%;margin-top:22px" onclick="addNewStudent()">إضافة طالب جديد</button></div>
    </div>
  </div>

  <div class="box">
    <h3>كشف الطلاب</h3>
    <table>
      <thead>
        <tr>
          <th>كود الطالب</th>
          <th>اسم الطالب</th>
          <th>الصف</th>
          <th>الشعبة</th>
          <th>عدد المواد</th>
          <th>الإجمالي</th>
          <th>التقدير العام</th>
          <th>إجراءات</th>
        </tr>
      </thead>
      <tbody id="students_body"></tbody>
    </table>
  </div>

  <div class="box" id="detail_box" style="display:none;">
    <h3>تفاصيل الطالب</h3>
    <div class="row">
      <div class="col-3"><label>كود الطالب</label><input id="st_code" disabled></div>
      <div class="col-3"><label>اسم الطالب</label><input id="st_name"></div>
      <div class="col-3"><label>الصف</label><select id="st_grade"></select></div>
      <div class="col-3"><label>الشعبة</label><select id="st_section"><option>أ</option><option>ب</option><option>ج</option><option>د</option></select></div>
      <div class="col-3"><label>نوع الاختبار</label><input id="st_exam_type" placeholder="مثال: اختبار منتصف الفصل"></div>
    </div>

    <button class="btn-secondary" onclick="addSubjectRow()">إضافة مادة</button>

    <table>
      <thead>
        <tr>
          <th>المادة</th><th>الدرجة النهائية</th><th>درجة الطالب</th><th>التقدير</th><th>حذف</th>
        </tr>
      </thead>
      <tbody id="subjects_body"></tbody>
    </table>

    <div style="margin-top:10px;font-size:14px;">
      <span>مجموع الدرجات:</span> <span id="total_marks" class="badge">0</span>
      <span style="margin-right:15px;">التقدير العام:</span> <span id="overall_rating" class="badge">—</span>
    </div>

    <div class="row" style="margin-top:15px;">
      <div class="col-6"><button class="btn-primary" style="width:100%" onclick="saveCurrentStudent()">حفظ</button></div>
      <div class="col-6"><button class="btn-secondary" style="width:100%" onclick="closeDetail()">إغلاق</button></div>
    </div>
  </div>

  <div class="box">
    <button class="btn-secondary" onclick="location='index.html'">الصفحة الرئيسية</button>
    <button class="btn-secondary" onclick="location='student.html'">صفحة الطالب</button>
  </div>

</div>

<script>
var firebaseConfig={
  apiKey:"AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
  authDomain:"all-subjects-14322.firebaseapp.com",
  projectId:"all-subjects-14322",
  storageBucket:"all-subjects-14322.firebasestorage.app",
  messagingSenderId:"813955287168",
  appId:"1:813955287168:web:07efa7dde95b117b9bbe65"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();
var gradesList=["1 ابتدائي","2 ابتدائي","3 ابتدائي","4 ابتدائي","5 ابتدائي","6 ابتدائي","1 متوسط","2 متوسط","3 متوسط","1 ثانوي","2 ثانوي","3 ثانوي"];
function initGrades(){["new_grade","st_grade"].forEach(id=>{let s=document.getElementById(id);gradesList.forEach(g=>{let o=document.createElement("option");o.textContent=g;o.value=g;s.appendChild(o);});});}
function calcRating(m,f){m=+m;f=+f;if(!m||!f)return"";let p=(m/f)*100;if(p>=90)return"ممتاز";if(p>=80)return"جيد جدًا";if(p>=70)return"جيد";if(p>=60)return"مقبول";return"ضعيف";}
function calcTotals(subs){let total=0,full=0;if(subs){Object.values(subs).forEach(s=>{total+=+s.mark||0;full+=+s.fullMark||0;});}return{total,full,rating:full?calcRating(total,full):"—"};}
async function loadStudents(){let name=document.getElementById('filter_name').value.trim();let code=document.getElementById('filter_code').value.trim();let tb=document.getElementById('students_body');tb.innerHTML="<tr><td colspan='8'>جار التحميل...</td></tr>";let q=await db.collection("students").get();tb.innerHTML="";let list=[];q.forEach(d=>{let s=d.data();if(name&&!s.name.includes(name))return;if(code&&!s.code.includes(code))return;list.push(s);});if(!list.length){tb.innerHTML="<tr><td colspan='8'>لا توجد بيانات</td></tr>";return;}list.forEach(s=>{let r=calcTotals(s.subjects);let tr=document.createElement("tr");tr.innerHTML=`<td>${s.code}</td><td>${s.name}</td><td>${s.grade}</td><td>${s.section}</td><td>${s.subjects?Object.keys(s.subjects).length:0}</td><td>${r.total}/${r.full}</td><td>${r.rating}</td><td><button class='small-btn btn-primary' onclick='openDetail("${s.code}")'>تعديل</button> <button class='small-btn btn-danger' onclick='deleteStudent("${s.code}")'>حذف</button></td>`;tb.appendChild(tr);});}
async function addNewStudent(){let c=new_code.value.trim(),n=new_name.value.trim(),g=new_grade.value,s=new_section.value;if(!c||!n)return alert("أدخل الكود والاسم");await db.collection("students").doc(c).set({code:c,name:n,grade:g,section:s,subjects:{}},{merge:true});alert("تم إضافة الطالب");loadStudents();}
async function deleteStudent(c){if(!confirm("حذف الطالب؟"))return;await db.collection("students").doc(c).delete();loadStudents();}
async function openDetail(c){let d=await db.collection("students").doc(c).get();if(!d.exists)return alert("غير موجود");let s=d.data();detail_box.style.display="block";st_code.value=s.code;st_name.value=s.name;st_grade.value=s.grade;st_section.value=s.section;st_exam_type.value=s.examType||"";subjects_body.innerHTML="";if(s.subjects)Object.keys(s.subjects).forEach(k=>addSubjectRow({...s.subjects[k],subjectName:k}));updateTotals();}
function closeDetail(){detail_box.style.display="none";}
function addSubjectRow(d){let tr=document.createElement("tr");tr.innerHTML=`<td><input class='sub-name' value='${d?.subjectName||""}'></td><td><input type='number' class='sub-full' value='${d?.fullMark||""}'></td><td><input type='number' class='sub-mark' value='${d?.mark||""}'></td><td class='sub-rating'>${d?.rating||""}</td><td><button class='small-btn btn-danger' onclick='this.closest("tr").remove();updateTotals()'>🗑</button></td>`;subjects_body.appendChild(tr);tr.querySelectorAll("input").forEach(i=>i.addEventListener("input",()=>{tr.querySelector(".sub-rating").innerText=calcRating(tr.querySelector(".sub-mark").value,tr.querySelector(".sub-full").value);updateTotals();}));}
function updateTotals(){let rows=document.querySelectorAll("#subjects_body tr"),total=0,full=0;rows.forEach(r=>{total+=+r.querySelector(".sub-mark").value||0;full+=+r.querySelector(".sub-full").value||0});total_marks.innerText=`${total}/${full}`;overall_rating.innerText=full?calcRating(total,full):"—";}
async function saveCurrentStudent(){let c=st_code.value,n=st_name.value,g=st_grade.value,s=st_section.value,e=st_exam_type.value;if(!n)return alert("أدخل الاسم");let subs={};document.querySelectorAll("#subjects_body tr").forEach(tr=>{let sub=tr.querySelector(".sub-name").value;if(!sub)return;subs[sub]={fullMark:+tr.querySelector(".sub-full").value||0,mark:+tr.querySelector(".sub-mark").value||0,rating:tr.querySelector(".sub-rating").innerText};});await db.collection("students").doc(c).set({code:c,name:n,grade:g,section:s,examType:e,subjects:subs},{merge:true});alert("تم الحفظ");loadStudents();}
initGrades();
</script>

</body>
</html>
