<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة المشرف - مدارس الفلاح الأهلية</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<style>
body{font-family:Calibri;background:#f4f4f4;margin:0}
.header{background:#1976d2;color:#fff;text-align:center;padding:15px}
.header h1{margin:0;font-size:24px}
.header h2{margin:5px 0 0;font-size:18px;color:#ffeb3b}
.container{max-width:1200px;margin:20px auto;padding:10px}
.box{background:#fff;border-radius:10px;padding:15px;margin-bottom:15px;box-shadow:0 0 8px rgba(0,0,0,0.1)}
h3{margin-top:0;color:#1976d2}
label{display:block;margin-top:5px}
input,select,button{font-family:Calibri;font-size:15px;padding:7px;margin-top:5px;border-radius:6px;border:1px solid #999;box-sizing:border-box}
input,select{width:100%}
button{cursor:pointer;font-weight:bold;border:none}
.btn-primary{background:#1976d2;color:#fff}
.btn-secondary{background:#757575;color:#fff}
.btn-danger{background:#d32f2f;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px}
.col-3{flex:1 1 23%}
.col-4{flex:1 1 30%}
.col-6{flex:1 1 48%}
.col-12{flex:1 1 100%}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
th,td{border:1px solid #ccc;text-align:center;padding:6px}
th{background:#1976d2;color:#fff}
tr:nth-child(even){background:#f9f9f9}
.small-btn{padding:4px 8px;font-size:12px;border-radius:5px}
.sub-table{margin-top:8px;border:1px solid #ccc;border-radius:6px}
.sub-table th{background:#42a5f5}
.badge{display:inline-block;padding:2px 6px;border-radius:10px;font-size:11px;background:#e3f2fd;color:#0d47a1}
.info{font-size:13px;color:#555;margin-top:5px}
</style>
</head>
<body>

<div class="header">
  <h1>مدارس الفلاح الأهلية</h1>
  <h2 id="header_exam">لوحة المشرف - نظام رصد الدرجات</h2>
</div>

<div class="container">

  <!-- إدارة الطلاب -->
  <div class="box">
    <h3>إدارة الطلاب</h3>

    <div class="row">
      <div class="col-3"><label>بحث بالاسم</label><input id="filter_name" placeholder="جزء من الاسم"></div>
      <div class="col-3"><label>بحث بالكود</label><input id="filter_code" placeholder="كود الطالب"></div>
      <div class="col-3" style="display:flex;align-items:flex-end">
        <button class="btn-primary" style="width:100%" onclick="loadStudents()">بحث</button>
      </div>
    </div>

    <hr>

    <div class="row">
      <div class="col-3"><label>كود الطالب</label><input id="new_code"></div>
      <div class="col-3"><label>اسم الطالب</label><input id="new_name"></div>
      <div class="col-3"><label>الصف</label><select id="new_grade"></select></div>
      <div class="col-3"><label>الشعبة</label>
        <select id="new_section"><option>أ</option><option>ب</option><option>ج</option><option>د</option><option>هـ</option></select>
      </div>
    </div>

    <button class="btn-primary" onclick="addNewStudent()">إضافة طالب</button>

    <button class="btn-danger" onclick="deleteAllStudents()" style="margin-top:10px;width:100%">
      حذف جميع الطلاب
    </button>

    <hr>

    <!-- اختيار صف وعرض طلابه -->
    <div class="row">
      <div class="col-3"><label>عرض طلاب صف</label><select id="show_grade" onchange="loadStudentsByGrade()"></select></div>
      <div class="col-3"><label>أسماء طلاب الصف</label><select id="students_in_grade"><option>—</option></select></div>
    </div>

    <div class="info">المواد يتم إعدادها من صفحة الإعدادات لكل صف مرة واحدة.</div>
  </div>

  <!-- كشف الطلاب -->
  <div class="box">
    <h3>كشف الطلاب ورصد الدرجات</h3>

    <div style="margin-bottom:8px;font-size:14px">
      <span>نوع الاختبار: </span>
      <span id="current_exam_type" class="badge">—</span>

      <button class="btn-secondary" style="float:left" onclick="location='settings.html'">
        إعداد المواد والاختبار
      </button>
    </div>

    <table>
      <thead>
        <tr>
          <th>الكود</th>
          <th>الاسم</th>
          <th>الصف</th>
          <th>الشعبة</th>
          <th>عدد المواد</th>
          <th>الإجمالي</th>
          <th>التقدير العام</th>
          <th>إجراءات</th>
        </tr>
      </thead>
      <tbody id="students_body"></tbody>
    </table>
  </div>

  <div class="box">
    <button class="btn-secondary" onclick="exportToExcel()">تصدير Excel</button>
    <button class="btn-secondary" onclick="location='index.html'">الصفحة الرئيسية</button>
    <button class="btn-secondary" onclick="location='student.html'">صفحة الطالب</button>
  </div>
</div>

<script>
/* ------------------------ Firebase ------------------------ */

var firebaseConfig={
  apiKey:"AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
  authDomain:"all-subjects-14322.firebaseapp.com",
  projectId:"all-subjects-14322",
  storageBucket:"all-subjects-14322.firebasestorage.app",
  messagingSenderId:"813955287168",
  appId:"1:813955287168:web:07efa7dde95b117b9bbe65"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();

/* ------------------------ بيانات النظام ------------------------ */

var gradesList=[
  "1 ابتدائي","2 ابتدائي","3 ابتدائي","4 ابتدائي","5 ابتدائي","6 ابتدائي",
  "1 متوسط","2 متوسط","3 متوسط",
  "1 ثانوي","2 ثانوي","3 ثانوي"
];

var examType="";
var studentsCache=[];
var studentsByCode={};
var subjectsCacheByGrade={};

/* ------------------------ تحميل الإعدادات ------------------------ */

async function loadSettings(){
  try{
    let set=await db.collection("settings").doc("general").get();
    if(set.exists){
      examType=set.data().examType||"";
      document.getElementById("current_exam_type").innerText=examType||"—";
      if(examType){
        document.getElementById("header_exam").innerText="لوحة المشرف - "+examType;
      }
    }
  }catch(e){console.log(e);}
}

/* ------------------------ ترتيب الصفوف ------------------------ */
const gradeOrder={
  "1 ابتدائي":1,"2 ابتدائي":2,"3 ابتدائي":3,
  "4 ابتدائي":4,"5 ابتدائي":5,"6 ابتدائي":6,
  "1 متوسط":7,"2 متوسط":8,"3 متوسط":9,
  "1 ثانوي":10,"2 ثانوي":11,"3 ثانوي":12
};

/* ------------------------ إعداد القوائم ------------------------ */

function initGrades(){
  var g1=document.getElementById("new_grade");
  var g2=document.getElementById("show_grade");

  gradesList.forEach(x=>{
    let o1=document.createElement("option"); o1.value=x;o1.textContent=x;
    let o2=document.createElement("option"); o2.value=x;o2.textContent=x;
    g1.appendChild(o1); g2.appendChild(o2);
  });
}

/* ------------------------ إضافة طالب ------------------------ */

async function addNewStudent(){
  let code=document.getElementById("new_code").value.trim();
  let name=document.getElementById("new_name").value.trim();
  let grade=document.getElementById("new_grade").value;
  let section=document.getElementById("new_section").value;

  if(!code||!name){alert("أدخل كود واسم الطالب");return;}

  await db.collection("students").doc(code).set({
    code, name, grade, section,
    examType,
    subjects:{}
  });

  alert("تم إضافة الطالب");
  document.getElementById("new_code").value="";
  document.getElementById("new_name").value="";
  loadStudents();
}

/* ------------------------ حذف جميع الطلاب ------------------------ */

async function deleteAllStudents(){
  if(!confirm("هل تريد حذف جميع الطلاب؟"))return;
  let snap=await db.collection("students").get();
  let batch=db.batch();
  snap.forEach(doc=>batch.delete(doc.ref));
  await batch.commit();
  alert("تم حذف جميع الطلاب");
  loadStudents();
}

/* ------------------------ تحميل طلاب صف معين ------------------------ */

async function loadStudentsByGrade(){
  let grade=document.getElementById("show_grade").value;
  let sel=document.getElementById("students_in_grade");
  sel.innerHTML="<option>جاري التحميل...</option>";

  let snap=await db.collection("students").where("grade","==",grade).get();
  sel.innerHTML="";
  if(snap.empty){sel.innerHTML="<option>لا يوجد طلاب</option>";return;}

  snap.forEach(doc=>{
    let s=doc.data();
    let opt=document.createElement("option");
    opt.value=s.code;
    opt.textContent=s.name+" — "+s.code;
    sel.appendChild(opt);
  });
}

/* ------------------------ تحميل الطلاب وترتيبهم ------------------------ */

async function loadStudents(){
  let fname=document.getElementById("filter_name").value.trim();
  let fcode=document.getElementById("filter_code").value.trim();
  let tbody=document.getElementById("students_body");

  tbody.innerHTML="<tr><td colspan='8'>جاري التحميل...</td></tr>";

  let snap=await db.collection("students").get();

  studentsCache=[];
  studentsByCode={};

  snap.forEach(doc=>{
    let s=doc.data();
    studentsCache.push(s);
    studentsByCode[s.code]=s;
  });

  // ترتيب حسب الصف ثم الاسم
  studentsCache.sort((a,b)=>{
    let g1=gradeOrder[a.grade]||999;
    let g2=gradeOrder[b.grade]||999;
    if(g1!==g2)return g1-g2;
    return (a.name||"").localeCompare(b.name||"","ar");
  });

  let filtered=studentsCache.filter(s=>{
    if(fcode && (!s.code || s.code.indexOf(fcode)===-1))return false;
    if(fname && (!s.name || s.name.indexOf(fname)===-1))return false;
    return true;
  });

  tbody.innerHTML="";
  if(filtered.length===0){
    tbody.innerHTML="<tr><td colspan='8'>لا توجد بيانات</td></tr>";
    return;
  }

  filtered.forEach(s=>{
    let total=0,full=0,count=0;
    if(s.subjects){
      count=Object.keys(s.subjects).length;
      Object.values(s.subjects).forEach(v=>{
        total+=Number(v.mark)||0;
        full+=Number(v.fullMark)||0;
      });
    }
    let rating=full?calcRating(total,full):"—";

    let tr=document.createElement("tr");
    tr.innerHTML=
      "<td>"+s.code+"</td>"+
      "<td>"+s.name+"</td>"+
      "<td>"+s.grade+"</td>"+
      "<td>"+s.section+"</td>"+
      "<td>"+count+"</td>"+
      "<td>"+total+"/"+full+"</td>"+
      "<td>"+rating+"</td>"+
      "<td><button class='small-btn btn-primary' onclick='toggleSubjects(\""+s.code+"\")'>رصد</button></td>";
    tbody.appendChild(tr);

    // سطر المواد
    let subTr=document.createElement("tr");
    subTr.id="subs_"+s.code;
    subTr.style.display="none";
    subTr.innerHTML="<td colspan='8'>"+
      "<table class='sub-table' width='100%'>"+
      "<thead><tr><th>المادة</th><th>النهائية</th><th>درجة الطالب</th><th>التقدير</th></tr></thead>"+
      "<tbody id='subs_body_"+s.code+"'></tbody></table>"+
      "<button class='btn-primary' style='margin-top:5px' onclick='saveSubjects(\""+s.code+"\")'>حفظ</button>"+
      "</td>";

    tbody.appendChild(subTr);
  });
}

/* ------------------------ تحميل مواد الصف ------------------------ */

async function getSubjectsTemplateForGrade(grade){
  if(subjectsCacheByGrade[grade])return subjectsCacheByGrade[grade];
  let doc=await db.collection("settings").doc("subjects_"+grade).get();
  if(doc.exists){
    subjectsCacheByGrade[grade]=doc.data().subjects||[];
    return subjectsCacheByGrade[grade];
  }
  return [];
}

async function toggleSubjects(code){
  let row=document.getElementById("subs_"+code);
  if(row.style.display==="none"){
    await buildSubjectsRows(code);
    row.style.display="table-row";
  }else row.style.display="none";
}

async function buildSubjectsRows(code){
  let student=studentsByCode[code];
  let grade=student.grade;
  let body=document.getElementById("subs_body_"+code);

  let template=await getSubjectsTemplateForGrade(grade);
  if(!template.length){
    body.innerHTML="<tr><td colspan='4'>لا توجد مواد لهذا الصف.</td></tr>";
    return;
  }

  body.innerHTML="";
  let existing=student.subjects||{};

  template.forEach(sub=>{
    let name=sub.name;
    let full=sub.fullMark;
    let old=existing[name]||{};
    let mark=old.mark||"";
    let rating=calcRating(mark,full);

    let tr=document.createElement("tr");
    tr.innerHTML=
      "<td>"+name+"</td>"+
      "<td>"+full+"</td>"+
      "<td><input type='number' class='sub-mark' value='"+mark+"' style='width:80px'></td>"+
      "<td class='sub-rate'>"+rating+"</td>";

    body.appendChild(tr);

    let markInput=tr.querySelector(".sub-mark");
    markInput.addEventListener("input",()=>{
      let m=Number(markInput.value)||0;
      tr.querySelector(".sub-rate").innerText=calcRating(m,full);
    });
  });
}

async function saveSubjects(code){
  let student=studentsByCode[code];
  let grade=student.grade;

  let template=await getSubjectsTemplateForGrade(grade);
  if(!template.length){alert("لا توجد مواد لهذا الصف");return;}

  let body=document.getElementById("subs_body_"+code);
  let rows=body.querySelectorAll("tr");
  let subs={};

  rows.forEach((tr,i)=>{
    let name=template[i].name;
    let full=template[i].fullMark;
    let mark=Number(tr.querySelector(".sub-mark").value)||0;
    subs[name]={fullMark:full,mark,rating:calcRating(mark,full)};
  });

  await db.collection("students").doc(code).set({
    subjects:subs,
    examType
  },{merge:true});

  alert("تم حفظ درجات الطالب");
  loadStudents();
}

/* ------------------------ التصدير Excel ------------------------ */

function exportToExcel(){
  let rows=[["الكود","الاسم","الصف","الشعبة","عدد المواد","الإجمالي","التقدير"]];
  document.querySelectorAll("#students_body tr").forEach(tr=>{
    if(tr.children.length===8){
      rows.push([
        tr.children[0].innerText,
        tr.children[1].innerText,
        tr.children[2].innerText,
        tr.children[3].innerText,
        tr.children[4].innerText,
        tr.children[5].innerText,
        tr.children[6].innerText
      ]);
    }
  });
  let ws=XLSX.utils.aoa_to_sheet(rows);
  let wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Students");
  XLSX.writeFile(wb,"students.xlsx");
}

/* ------------------------ بداية التشغيل ------------------------ */

initGrades();
loadSettings();
loadStudents();
</script>

</body>
</html>
