<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة المشرف - مدارس الفلاح الأهلية</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<style>
body{font-family:Calibri;background:#f4f4f4;margin:0}
.header{background:#1976d2;color:#fff;text-align:center;padding:15px}
.header h1{margin:0;font-size:24px}
.header h2{margin:5px 0 0;font-size:18px;color:#ffeb3b}
.container{max-width:1200px;margin:20px auto;padding:10px}
.box{background:#fff;border-radius:10px;padding:15px;margin-bottom:15px;box-shadow:0 0 8px rgba(0,0,0,0.1)}
h3{margin-top:0;color:#1976d2}
label{display:block;margin-top:5px}
input,select,button{font-family:Calibri;font-size:15px;padding:7px;margin-top:5px;border-radius:6px;border:1px solid #999;box-sizing:border-box}
input,select{width:100%}
button{cursor:pointer;font-weight:bold;border:none}
.btn-primary{background:#1976d2;color:#fff}
.btn-secondary{background:#757575;color:#fff}
.btn-danger{background:#d32f2f;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px}
.col-3{flex:1 1 23%}
.col-4{flex:1 1 30%}
.col-6{flex:1 1 48%}
.col-12{flex:1 1 100%}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
th,td{border:1px solid #ccc;text-align:center;padding:6px}
th{background:#1976d2;color:#fff}
tr:nth-child(even){background:#f9f9f9}
.small-btn{padding:4px 8px;font-size:12px;border-radius:5px}
.sub-table{margin-top:8px;border:1px solid #ccc;border-radius:6px}
.sub-table th{background:#42a5f5}
.badge{display:inline-block;padding:2px 6px;border-radius:10px;font-size:11px;background:#e3f2fd;color:#0d47a1}
.info{font-size:13px;color:#555;margin-top:5px}
</style>
</head>
<body>

<div class="header">
  <h1>مدارس الفلاح الأهلية</h1>
  <h2 id="header_exam">لوحة المشرف - نظام رصد الدرجات</h2>
</div>

<div class="container">

  <div class="box">
    <h3>إدارة الطلاب</h3>
    <div class="row">
      <div class="col-3"><label>بحث بالاسم</label><input id="filter_name" placeholder="جزء من الاسم"></div>
      <div class="col-3"><label>بحث بالكود</label><input id="filter_code" placeholder="كود الطالب"></div>
      <div class="col-3" style="display:flex;align-items:flex-end"><button class="btn-primary" style="width:100%" onclick="loadStudents()">بحث</button></div>
    </div>
    <hr>
    <div class="row">
      <div class="col-3"><label>كود الطالب</label><input id="new_code" placeholder="مثال: 1001"></div>
      <div class="col-3"><label>اسم الطالب</label><input id="new_name"></div>
      <div class="col-3"><label>الصف</label><select id="new_grade"></select></div>
      <div class="col-3"><label>الشعبة</label><select id="new_section"><option>أ</option><option>ب</option><option>ج</option><option>د</option><option>هـ</option></select></div>
    </div>
    <button class="btn-primary" onclick="addNewStudent()">إضافة طالب</button>
    <div class="info">المواد والدرجات النهائية يتم إعدادها من صفحة الإعدادات لكل صف مرة واحدة فقط.</div>
  </div>

  <div class="box">
    <h3>كشف الطلاب ورصد الدرجات</h3>
    <div style="margin-bottom:8px;font-size:14px">
      <span>نوع الاختبار الحالي: </span>
      <span id="current_exam_type" class="badge">لم يتم التحديد</span>
      <button class="btn-secondary" style="float:left" onclick="location='settings.html'">إعداد المواد والاختبار</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>الكود</th>
          <th>الاسم</th>
          <th>الصف</th>
          <th>الشعبة</th>
          <th>عدد المواد</th>
          <th>الإجمالي</th>
          <th>التقدير العام</th>
          <th>إجراءات</th>
        </tr>
      </thead>
      <tbody id="students_body"></tbody>
    </table>
  </div>

  <div class="box">
    <button class="btn-secondary" onclick="exportToExcel()">تصدير إلى Excel</button>
    <button class="btn-secondary" onclick="location='index.html'">الصفحة الرئيسية</button>
    <button class="btn-secondary" onclick="location='student.html'">صفحة الطالب</button>
  </div>

</div>

<script>
var firebaseConfig = {
  apiKey:"AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
  authDomain:"all-subjects-14322.firebaseapp.com",
  projectId:"all-subjects-14322",
  storageBucket:"all-subjects-14322.firebasestorage.app",
  messagingSenderId:"813955287168",
  appId:"1:813955287168:web:07efa7dde95b117b9bbe65"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();

var gradesList=[
  "1 ابتدائي","2 ابتدائي","3 ابتدائي","4 ابتدائي","5 ابتدائي","6 ابتدائي",
  "1 متوسط","2 متوسط","3 متوسط",
  "1 ثانوي","2 ثانوي","3 ثانوي"
];

var examType="";
var studentsCache=[];
var studentsByCode={};
var subjectsCacheByGrade={};

function initGrades(){
  var g=document.getElementById("new_grade");
  gradesList.forEach(function(x){
    var o=document.createElement("option");
    o.value=x;o.textContent=x;
    g.appendChild(o);
  });
}

function calcRating(m,f){
  m=Number(m);f=Number(f);
  if(!m||!f)return"";
  var p=(m/f)*100;
  if(p>=90)return"ممتاز";
  if(p>=80)return"جيد جدًا";
  if(p>=70)return"جيد";
  if(p>=60)return"مقبول";
  return"ضعيف";
}

async function loadSettings(){
  try{
    var gen=await db.collection("settings").doc("general").get();
    if(gen.exists){
      examType=gen.data().examType||"";
      document.getElementById("current_exam_type").innerText=examType||"لم يتم التحديد";
      if(examType){
        document.getElementById("header_exam").innerText="لوحة المشرف - "+examType;
      }
    }
  }catch(e){console.log(e);}
}

async function addNewStudent(){
  var code=document.getElementById("new_code").value.trim();
  var name=document.getElementById("new_name").value.trim();
  var grade=document.getElementById("new_grade").value;
  var section=document.getElementById("new_section").value;
  if(!code||!name){alert("أدخل كود واسم الطالب");return;}
  await db.collection("students").doc(code).set({
    code:code,
    name:name,
    grade:grade,
    section:section,
    examType:examType||"",
    subjects:{}
  },{merge:true});
  alert("تم إضافة الطالب");
  document.getElementById("new_code").value="";
  document.getElementById("new_name").value="";
  loadStudents();
}

async function loadStudents(){
  var fname=document.getElementById("filter_name").value.trim();
  var fcode=document.getElementById("filter_code").value.trim();
  var tbody=document.getElementById("students_body");
  tbody.innerHTML="<tr><td colspan='8'>جاري التحميل...</td></tr>";
  studentsCache=[];
  studentsByCode={};
  try{
    var snap=await db.collection("students").get();
    tbody.innerHTML="";
    snap.forEach(function(doc){
      var s=doc.data();
      studentsCache.push(s);
      if(s.code)studentsByCode[s.code]=s;
    });
    var filtered=studentsCache.filter(function(s){
      if(fcode && (!s.code || s.code.indexOf(fcode)===-1))return false;
      if(fname && (!s.name || s.name.indexOf(fname)===-1))return false;
      return true;
    });
    if(filtered.length===0){
      tbody.innerHTML="<tr><td colspan='8'>لا توجد بيانات</td></tr>";
      return;
    }
    filtered.forEach(function(s){
      var total=0,full=0;
      if(s.subjects){
        Object.values(s.subjects).forEach(function(v){
          total+=Number(v.mark)||0;
          full+=Number(v.fullMark)||0;
        });
      }
      var rating=full?calcRating(total,full):"—";
      var count=s.subjects?Object.keys(s.subjects).length:0;
      var tr=document.createElement("tr");
      tr.innerHTML=
        "<td>"+(s.code||"")+"</td>"+
        "<td>"+(s.name||"")+"</td>"+
        "<td>"+(s.grade||"")+"</td>"+
        "<td>"+(s.section||"")+"</td>"+
        "<td>"+count+"</td>"+
        "<td>"+total+"/"+full+"</td>"+
        "<td>"+rating+"</td>"+
        "<td>"+
          "<button class='small-btn btn-primary' onclick='toggleSubjects(\""+s.code+"\")'>رصد الدرجات</button> "+
          "<button class='small-btn btn-danger' onclick='deleteStudent(\""+s.code+"\")'>حذف</button>"+
        "</td>";
      tbody.appendChild(tr);

      var subTr=document.createElement("tr");
      subTr.id="subs_"+s.code;
      subTr.style.display="none";
      subTr.innerHTML="<td colspan='8'>"+
        "<table class='sub-table' width='100%'>"+
        "<thead><tr><th>المادة</th><th>الدرجة النهائية</th><th>درجة الطالب</th><th>التقدير</th></tr></thead>"+
        "<tbody id='subs_body_"+s.code+"'></tbody>"+
        "</table>"+
        "<button class='btn-primary' style='margin-top:5px' onclick='saveSubjects(\""+s.code+"\")'>حفظ درجات الطالب</button>"+
        "</td>";
      tbody.appendChild(subTr);
    });
  }catch(e){
    console.log(e);
    alert("خطأ في تحميل الطلاب");
  }
}

async function getSubjectsTemplateForGrade(grade){
  if(subjectsCacheByGrade[grade])return subjectsCacheByGrade[grade];
  var doc=await db.collection("settings").doc("subjects_"+grade).get();
  if(doc.exists){
    var arr=doc.data().subjects||[];
    subjectsCacheByGrade[grade]=arr;
    return arr;
  }
  return [];
}

async function toggleSubjects(code){
  var tr=document.getElementById("subs_"+code);
  if(tr.style.display==="none"){
    await buildSubjectsRows(code);
    tr.style.display="table-row";
  }else{
    tr.style.display="none";
  }
}

async function buildSubjectsRows(code){
  var st=studentsByCode[code]||{};
  var grade=st.grade;
  var body=document.getElementById("subs_body_"+code);
  if(!grade){
    body.innerHTML="<tr><td colspan='4'>لا يوجد صف محدد لهذا الطالب</td></tr>";
    return;
  }
  body.innerHTML="<tr><td colspan='4'>جاري تحميل مواد الصف...</td></tr>";
  var template=await getSubjectsTemplateForGrade(grade);
  if(!template.length){
    body.innerHTML="<tr><td colspan='4'>لم يتم إعداد مواد لهذا الصف بعد. يرجى الذهاب لصفحة الإعدادات.</td></tr>";
    return;
  }
  body.innerHTML="";
  var existing=st.subjects||{};
  template.forEach(function(sub){
    var name=sub.name;
    var full=sub.fullMark||0;
    var old=existing[name]||{};
    var mark=old.mark||"";
    var rating=old.rating||calcRating(mark,full);
    var tr=document.createElement("tr");
    tr.innerHTML=
      "<td>"+name+"</td>"+
      "<td>"+full+"</td>"+
      "<td><input type='number' class='sub-mark' value='"+mark+"' style='width:80px'></td>"+
      "<td class='sub-rate'>"+(rating||"")+"</td>";
    body.appendChild(tr);
    var markInput=tr.querySelector(".sub-mark");
    markInput.addEventListener("input",function(){
      var m=Number(markInput.value)||0;
      tr.querySelector(".sub-rate").innerText=calcRating(m,full);
    });
  });
}

async function saveSubjects(code){
  var st=studentsByCode[code]||{};
  var grade=st.grade;
  if(!grade){alert("لا يوجد صف محدد لهذا الطالب");return;}
  var template=await getSubjectsTemplateForGrade(grade);
  if(!template.length){
    alert("لا توجد مواد محفوظة لهذا الصف في الإعدادات");
    return;
  }
  var body=document.getElementById("subs_body_"+code);
  var rows=body.querySelectorAll("tr");
  var subs={};
  rows.forEach(function(tr,index){
    if(index>=template.length)return;
    var name=template[index].name;
    var full=template[index].fullMark||0;
    var m=Number(tr.querySelector(".sub-mark").value)||0;
    subs[name]={fullMark:full,mark:m,rating:calcRating(m,full)};
  });
  await db.collection("students").doc(code).set({
    subjects:subs,
    examType:examType||""
  },{merge:true});
  alert("تم حفظ درجات الطالب");
  loadStudents();
}

async function deleteStudent(code){
  if(!confirm("هل تريد حذف هذا الطالب بالكامل؟"))return;
  await db.collection("students").doc(code).delete();
  loadStudents();
}

function exportToExcel(){
  var rows=[["الكود","الاسم","الصف","الشعبة","عدد المواد","الإجمالي","التقدير العام"]];
  var trs=document.querySelectorAll("#students_body tr");
  trs.forEach(function(tr){
    if(tr.children.length===8){
      var cols=[...tr.children].map(function(td){return td.innerText;});
      rows.push(cols.slice(0,7));
    }
  });
  var ws=XLSX.utils.aoa_to_sheet(rows);
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"الطلاب");
  XLSX.writeFile(wb,"كشف_الطلاب.xlsx");
}

initGrades();
loadSettings();
loadStudents();
</script>

</body>
</html>
