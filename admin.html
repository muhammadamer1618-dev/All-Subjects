<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة المشرف - مدارس الفلاح الأهلية</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<style>
body{font-family:Calibri;background:#f4f4f4;margin:0}
.header{background:#1976d2;color:#fff;text-align:center;padding:15px}
.header h1{margin:0;font-size:24px}
.header h2{margin:5px 0 0;font-size:18px;color:#ffeb3b}
.container{max-width:1200px;margin:20px auto;padding:10px}
.box{background:#fff;border-radius:10px;padding:15px;margin-bottom:15px;box-shadow:0 0 8px rgba(0,0,0,0.1)}
h3{margin-top:0;color:#1976d2}
label{display:block;margin-top:5px}
input,select,button{font-family:Calibri;font-size:15px;padding:7px;margin-top:5px;border-radius:6px;border:1px solid #999;box-sizing:border-box}
input,select{width:100%}
button{cursor:pointer;font-weight:bold;border:none}
.btn-primary{background:#1976d2;color:#fff}
.btn-secondary{background:#757575;color:#fff}
.btn-danger{background:#d32f2f;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px}
.col-3{flex:1 1 23%}
.col-4{flex:1 1 30%}
.col-6{flex:1 1 48%}
.col-12{flex:1 1 100%}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
th,td{border:1px solid #ccc;text-align:center;padding:6px}
th{background:#1976d2;color:#fff}
tr:nth-child(even){background:#f9f9f9}
.small-btn{padding:4px 8px;font-size:12px;border-radius:5px}
.sub-table{margin-top:8px;border:1px solid #ccc;border-radius:6px}
.sub-table th{background:#42a5f5}
</style>
</head>
<body>

<div class="header">
  <h1>مدارس الفلاح الأهلية</h1>
  <h2>لوحة المشرف - نظام إدارة الدرجات</h2>
</div>

<div class="container">

  <div class="box">
    <h3>الإعدادات العامة</h3>
    <div class="row">
      <div class="col-6"><label>نوع الاختبار العام</label><input id="exam_type" placeholder="مثال: اختبار منتصف الفصل"></div>
      <div class="col-6" style="display:flex;align-items:flex-end"><button class="btn-primary" style="width:100%" onclick="saveExamType()">حفظ نوع الاختبار</button></div>
    </div>
  </div>

  <div class="box">
    <h3>إدارة الطلاب</h3>
    <div class="row">
      <div class="col-3"><label>كود الطالب</label><input id="new_code" placeholder="مثال: 1001"></div>
      <div class="col-3"><label>اسم الطالب</label><input id="new_name"></div>
      <div class="col-3"><label>الصف</label><select id="new_grade"></select></div>
      <div class="col-3"><label>الشعبة</label><select id="new_section"><option>أ</option><option>ب</option><option>ج</option><option>د</option><option>هـ</option></select></div>
    </div>
    <button class="btn-primary" onclick="addNewStudent()">إضافة طالب</button>
  </div>

  <div class="box">
    <h3>كشف الطلاب</h3>
    <table>
      <thead>
        <tr>
          <th>الكود</th><th>الاسم</th><th>الصف</th><th>الشعبة</th><th>عدد المواد</th><th>الإجمالي</th><th>التقدير العام</th><th>إجراءات</th>
        </tr>
      </thead>
      <tbody id="students_body"></tbody>
    </table>
  </div>

  <div class="box">
    <button class="btn-secondary" onclick="exportToExcel()">تصدير إلى Excel</button>
    <button class="btn-secondary" onclick="location='index.html'">الصفحة الرئيسية</button>
    <button class="btn-secondary" onclick="location='student.html'">صفحة الطالب</button>
  </div>

</div>

<script>
var firebaseConfig = {
  apiKey:"AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
  authDomain:"all-subjects-14322.firebaseapp.com",
  projectId:"all-subjects-14322",
  storageBucket:"all-subjects-14322.firebasestorage.app",
  messagingSenderId:"813955287168",
  appId:"1:813955287168:web:07efa7dde95b117b9bbe65"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();
var examType="";

async function loadExamType(){
  const doc=await db.collection("settings").doc("general").get();
  if(doc.exists){examType=doc.data().examType||"";document.getElementById("exam_type").value=examType;}
}
async function saveExamType(){
  examType=document.getElementById("exam_type").value.trim();
  await db.collection("settings").doc("general").set({examType});
  alert("تم حفظ نوع الاختبار");
}

var gradesList=["1 ابتدائي","2 ابتدائي","3 ابتدائي","4 ابتدائي","5 ابتدائي","6 ابتدائي","1 متوسط","2 متوسط","3 متوسط","1 ثانوي","2 ثانوي","3 ثانوي"];
function initGrades(){
  const g=document.getElementById("new_grade");
  gradesList.forEach(x=>{let o=document.createElement("option");o.text=x;o.value=x;g.appendChild(o)});
}

function calcRating(m,f){
  m=Number(m);f=Number(f);if(!m||!f)return"";let p=(m/f)*100;
  if(p>=90)return"ممتاز";if(p>=80)return"جيد جدًا";if(p>=70)return"جيد";if(p>=60)return"مقبول";return"ضعيف";
}

async function addNewStudent(){
  const code=document.getElementById("new_code").value.trim();
  const name=document.getElementById("new_name").value.trim();
  const grade=document.getElementById("new_grade").value;
  const section=document.getElementById("new_section").value;
  if(!code||!name){alert("أدخل كود واسم الطالب");return;}
  await db.collection("students").doc(code).set({code,name,grade,section,examType,subjects:{}});
  alert("تم إضافة الطالب");loadStudents();
}

async function loadStudents(){
  const tbody=document.getElementById("students_body");
  tbody.innerHTML="<tr><td colspan='8'>جاري التحميل...</td></tr>";
  const snap=await db.collection("students").get();
  tbody.innerHTML="";
  snap.forEach(doc=>{
    const s=doc.data();
    let total=0,full=0; if(s.subjects){Object.values(s.subjects).forEach(v=>{total+=Number(v.mark)||0;full+=Number(v.fullMark)||0;});}
    const rate=full?calcRating(total,full):"—";
    const cnt=s.subjects?Object.keys(s.subjects).length:0;
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${s.code}</td><td>${s.name}</td><td>${s.grade}</td><td>${s.section}</td>
    <td>${cnt}</td><td>${total}/${full}</td><td>${rate}</td>
    <td>
      <button class='small-btn btn-primary' onclick='toggleSubjects("${s.code}")'>تعديل الدرجات</button>
      <button class='small-btn btn-danger' onclick='deleteStudent("${s.code}")'>حذف</button>
    </td>`;
    tbody.appendChild(tr);

    const subTr=document.createElement("tr");
    subTr.id="subs_"+s.code;
    subTr.style.display="none";
    subTr.innerHTML=`<td colspan='8'>
      <table class='sub-table' width='100%'>
        <thead><tr><th>المادة</th><th>الدرجة النهائية</th><th>درجة الطالب</th><th>التقدير</th><th>إزالة</th></tr></thead>
        <tbody id='subs_body_${s.code}'></tbody>
      </table>
      <button class='btn-secondary' onclick='addSubject("${s.code}")'>إضافة مادة</button>
      <button class='btn-primary' onclick='saveSubjects("${s.code}")'>حفظ المواد</button>
    </td>`;
    tbody.appendChild(subTr);
    if(s.subjects){Object.keys(s.subjects).forEach(k=>addSubjectRow(s.code,k,s.subjects[k]));}
  });
}

function toggleSubjects(code){
  const tr=document.getElementById("subs_"+code);
  tr.style.display=tr.style.display==="none"?"table-row":"none";
}

function addSubject(code){
  addSubjectRow(code,"",{mark:"",fullMark:""});
}

function addSubjectRow(code,name,d){
  const body=document.getElementById("subs_body_"+code);
  const tr=document.createElement("tr");
  tr.innerHTML=`<td><input value='${name||""}' class='sub-name'></td>
  <td><input type='number' value='${d.fullMark||""}' class='sub-full'></td>
  <td><input type='number' value='${d.mark||""}' class='sub-mark'></td>
  <td class='sub-rate'>${calcRating(d.mark,d.fullMark)}</td>
  <td><button class='small-btn btn-danger' onclick='this.closest("tr").remove()'>🗑</button></td>`;
  body.appendChild(tr);
  tr.querySelector(".sub-full").oninput=()=>{tr.querySelector(".sub-rate").innerText=calcRating(tr.querySelector(".sub-mark").value,tr.querySelector(".sub-full").value)};
  tr.querySelector(".sub-mark").oninput=()=>{tr.querySelector(".sub-rate").innerText=calcRating(tr.querySelector(".sub-mark").value,tr.querySelector(".sub-full").value)};
}

async function saveSubjects(code){
  const rows=document.querySelectorAll(`#subs_body_${code} tr`);
  let subs={};
  rows.forEach(r=>{
    const n=r.querySelector(".sub-name").value.trim();
    if(!n)return;
    const f=Number(r.querySelector(".sub-full").value)||0;
    const m=Number(r.querySelector(".sub-mark").value)||0;
    subs[n]={fullMark:f,mark:m,rating:calcRating(m,f)};
  });
  await db.collection("students").doc(code).update({subjects:subs});
  alert("تم حفظ المواد");
  loadStudents();
}

async function deleteStudent(code){
  if(!confirm("هل تريد حذف هذا الطالب؟"))return;
  await db.collection("students").doc(code).delete();
  loadStudents();
}

function exportToExcel(){
  var rows=[["الكود","الاسم","الصف","الشعبة","عدد المواد","الإجمالي","التقدير العام"]];
  document.querySelectorAll("#students_body tr").forEach(tr=>{
    if(tr.children.length>=7){
      const cols=[...tr.children].map(td=>td.innerText);
      rows.push(cols.slice(0,7));
    }
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"الطلاب");
  XLSX.writeFile(wb,"كشف_الطلاب.xlsx");
}

initGrades();
loadExamType();
loadStudents();
</script>

</body>
</html>
