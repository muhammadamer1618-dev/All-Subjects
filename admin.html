<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة المشرف - مدارس الفلاح الأهلية</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<style>
body{font-family:Calibri;background:#f4f4f4;margin:0}
.header{background:#1976d2;color:#fff;text-align:center;padding:15px}
.header h1{margin:0;font-size:24px}
.header h2{margin:5px 0 0;font-size:18px;color:#ffeb3b}
.container{max-width:1200px;margin:20px auto;padding:10px}
.box{background:#fff;border-radius:10px;padding:15px;margin-bottom:15px;box-shadow:0 0 8px rgba(0,0,0,0.1)}
h3{margin-top:0;color:#1976d2}
label{display:block;margin-top:5px}
input,select,button{font-family:Calibri;font-size:15px;padding:7px;margin-top:5px;border-radius:6px;border:1px solid #999;box-sizing:border-box}
input,select{width:100%}
button{cursor:pointer;font-weight:bold;border:none}
.btn-primary{background:#1976d2;color:#fff}
.btn-secondary{background:#757575;color:#fff}
.btn-danger{background:#d32f2f;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px}
.col-3{flex:1 1 23%}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
th,td{border:1px solid #ccc;text-align:center;padding:6px}
th{background:#1976d2;color:#fff}
.small-btn{padding:4px 8px;font-size:12px;border-radius:5px}
.sub-table th{background:#42a5f5}
.badge{background:#e3f2fd;color:#0d47a1;padding:3px 6px;border-radius:8px;font-size:13px}
</style>
</head>

<body>

<div class="header">
  <h1>مدارس الفلاح الأهلية</h1>
  <h2 id="header_exam">لوحة المشرف - نظام رصد الدرجات</h2>
</div>

<div class="container">

<!-- إدارة الطلاب -->
<div class="box">
  <h3>إدارة الطلاب</h3>

  <div class="row">
    <div class="col-3"><label>بحث بالاسم</label><input id="filter_name"></div>
    <div class="col-3"><label>بحث بالكود</label><input id="filter_code"></div>
    <div class="col-3" style="display:flex;align-items:flex-end">
      <button class="btn-primary" onclick="loadStudents()">بحث</button>
    </div>
  </div>

  <hr>

  <div class="row">
    <div class="col-3"><label>كود الطالب</label><input id="new_code"></div>
    <div class="col-3"><label>اسم الطالب</label><input id="new_name"></div>
    <div class="col-3"><label>الصف</label><select id="new_grade"></select></div>
    <div class="col-3"><label>الشعبة</label>
      <select id="new_section">
        <option>أ</option><option>ب</option><option>ج</option><option>د</option><option>هـ</option>
      </select>
    </div>
  </div>

  <button class="btn-primary" onclick="addNewStudent()">إضافة طالب</button>

  <button class="btn-danger" onclick="deleteAllStudents()" style="margin-top:10px;width:100%">
    حذف جميع الطلاب
  </button>

  <hr>

  <label>استيراد الطلاب من Excel</label>
  <input type="file" id="students_file" accept=".xlsx,.xls">
  <button class="btn-secondary" onclick="importStudentsFromExcel()">استيراد الطلاب</button>
</div>

<!-- كشف الطلاب -->
<div class="box">
  <h3>كشف الطلاب</h3>

  <div style="margin-bottom:8px;font-size:14px">
    <span>نوع الاختبار:</span>
    <span id="current_exam_type" class="badge">—</span>
    <button class="btn-secondary" style="float:left" onclick="location='settings.html'">الإعدادات</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>الكود</th><th>الاسم</th><th>الصف</th><th>الشعبة</th>
        <th>عدد المواد</th><th>الإجمالي</th><th>التقدير</th><th>إجراءات</th>
      </tr>
    </thead>
    <tbody id="students_body"></tbody>
  </table>
</div>

<!-- رصد صف كامل -->
<div class="box">
  <h3>رصد درجات صف كامل</h3>

  <div class="row">
    <div class="col-3"><label>الصف</label><select id="marks_grade"></select></div>
    <div class="col-3"><label>الشعبة</label>
      <select id="marks_section">
        <option value="">كل الشعب</option>
        <option>أ</option><option>ب</option><option>ج</option><option>د</option><option>هـ</option>
      </select>
    </div>
    <div class="col-3" style="display:flex;align-items:flex-end">
      <button class="btn-primary" onclick="loadGradeMarks()">عرض الصف</button>
    </div>
  </div>

  <div id="grade_marks_container" style="margin-top:15px;overflow-x:auto;">
    <table id="grade_marks_table" style="min-width:700px;display:none;">
      <thead id="grade_marks_head"></thead>
      <tbody id="grade_marks_body"></tbody>
    </table>
  </div>

  <button id="save_grade_marks_btn" class="btn-primary" style="margin-top:10px;display:none;" onclick="saveGradeMarks()">حفظ الدرجات</button>
</div>

</div>

<script>
// Firebase
firebase.initializeApp({
  apiKey:"AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
  authDomain:"all-subjects-14322.firebaseapp.com",
  projectId:"all-subjects-14322"
});
var db=firebase.firestore();

// بيانات عامة
var examType="", subjectsCache={}, studentsCache=[], studentsByCode={};

var grades=[
 "1 ابتدائي","2 ابتدائي","3 ابتدائي","4 ابتدائي","5 ابتدائي","6 ابتدائي",
 "1 متوسط","2 متوسط","3 متوسط","1 ثانوي","2 ثانوي","3 ثانوي"
];

var order={
 "1 ابتدائي":1,"2 ابتدائي":2,"3 ابتدائي":3,
 "4 ابتدائي":4,"5 ابتدائي":5,"6 ابتدائي":6,
 "1 متوسط":7,"2 متوسط":8,"3 متوسط":9,
 "1 ثانوي":10,"2 ثانوي":11,"3 ثانوي":12
};

// التقدير
function calcRating(m,f){
  if(!m||!f)return "";
  let p=(m/f)*100;
  if(p>=90)return"ممتاز";
  if(p>=80)return"جيد جداً";
  if(p>=70)return"جيد";
  if(p>=60)return"مقبول";
  return"ضعيف";
}

// تحميل نوع الاختبار
async function loadSettings(){
  let d=await db.collection("settings").doc("general").get();
  if(d.exists){
    examType=d.data().examType||"";
    document.getElementById("current_exam_type").innerText=examType||"—";
    document.getElementById("header_exam").innerText="لوحة المشرف - "+(examType||"");
  }
}

// تحميل صفوف
function initGrades(){
  let g1=document.getElementById("new_grade");
  let g2=document.getElementById("marks_grade");
  grades.forEach(x=>{
    let o=document.createElement("option");o.value=x;o.textContent=x;
    g1.appendChild(o.cloneNode(true));
    g2.appendChild(o.cloneNode(true));
  });
}

// إضافة طالب
async function addNewStudent(){
  let code=new_code.value.trim(), name=new_name.value.trim();
  let grade=new_grade.value, section=new_section.value;
  if(!code||!name){alert("أدخل البيانات");return;}
  await db.collection("students").doc(code).set({
    code,name,grade,section,examType,subjects:{}
  },{merge:true});
  alert("تم");
  new_code.value=""; new_name.value="";
  loadStudents();
}

// حذف كل الطلاب
async function deleteAllStudents(){
  if(!confirm("متأكد؟"))return;
  let s=await db.collection("students").get();
  let b=db.batch();
  s.forEach(d=>b.delete(d.ref));
  await b.commit();
  alert("تم الحذف");
  loadStudents();
}

// حذف طالب
async function deleteStudent(code){
  if(!confirm("حذف الطالب؟"))return;
  await db.collection("students").doc(code).delete();
  loadStudents();
}

// نقل طالب
async function moveStudent(code){
  let d=await db.collection("students").doc(code).get();
  if(!d.exists)return alert("غير موجود");
  let s=d.data();
  let g=prompt("الصف الجديد:",s.grade); if(!g)return;
  let sec=prompt("الشعبة الجديدة:",s.section); if(!sec)return;
  let keep=confirm("الاحتفاظ بالدرجات؟");
  await db.collection("students").doc(code).set({
    grade:g, section:sec, subjects: keep? s.subjects:{} 
  },{merge:true});
  alert("تم النقل");
  loadStudents();
}

// استيراد الطلاب
async function importStudentsFromExcel(){
  let f=students_file.files[0];
  if(!f){alert("اختر ملف");return;}
  let r=new FileReader();
  r.onload=e=>{
    let wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
    let ws=wb.Sheets[wb.SheetNames[0]];
    let rows=XLSX.utils.sheet_to_json(ws,{header:1});
    let b=db.batch();
    let c=0;
    rows.forEach((r,i)=>{
      if(i===0)return;
      let code=(r[0]||"")+"";
      let name=(r[1]||"")+"";
      let grade=(r[2]||"")+"";
      let section=(r[3]||"")+"";
      if(!code||!name)return;
      b.set(db.collection("students").doc(code),{
        code,name,grade,section,examType,subjects:{}
      },{merge:true});
      c++;
    });
    b.commit().then(()=>{
      alert("تم استيراد "+c);
      loadStudents();
    });
  };
  r.readAsArrayBuffer(f);
}

// تحميل المواد للصف
async function getSubjects(grade){
  if(subjectsCache[grade])return subjectsCache[grade];
  let d=await db.collection("settings").doc("subjects_"+grade).get();
  if(d.exists){
    subjectsCache[grade]=d.data().subjects||[];
    return subjectsCache[grade];
  }
  return [];
}

// تحميل الطلاب
async function loadStudents(){
  let name=filter_name.value.trim(), code=filter_code.value.trim();
  let tbody=students_body;
  tbody.innerHTML="<tr><td colspan='8'>تحميل...</td></tr>";

  let s=await db.collection("students").get();
  studentsCache=[]; studentsByCode={};

  s.forEach(d=>{
    let x=d.data();
    studentsCache.push(x);
    studentsByCode[x.code]=x;
  });

  studentsCache.sort((a,b)=>{
    let x=order[a.grade]||999, y=order[b.grade]||999;
    if(x!==y)return x-y;
    return a.name.localeCompare(b.name,"ar");
  });

  let list=studentsCache.filter(s=>{
    if(code && s.code.indexOf(code)==-1)return false;
    if(name && s.name.indexOf(name)==-1)return false;
    return true;
  });

  tbody.innerHTML="";
  if(!list.length)return tbody.innerHTML="<tr><td colspan='8'>لا يوجد</td></tr>";

  list.forEach(s=>{
    let total=0;
    let count=0;
    if(s.subjects){
      Object.values(s.subjects).forEach(v=>{
        total+=Number(v.mark)||0;
        count++;
      });
    }
    let tr=document.createElement("tr");
    tr.innerHTML=
      "<td>"+s.code+"</td>"+
      "<td>"+s.name+"</td>"+
      "<td>"+s.grade+"</td>"+
      "<td>"+s.section+"</td>"+
      "<td>"+count+"</td>"+
      "<td>"+total+"</td>"+
      "<td>"+(count?calcRating(total,100):"—")+"</td>"+
      "<td>"+
        "<button class='small-btn btn-primary' onclick='moveStudent(\""+s.code+"\")'>نقل</button> "+
        "<button class='small-btn btn-danger' onclick='deleteStudent(\""+s.code+"\")'>حذف</button>"+
      "</td>";
    tbody.appendChild(tr);
  });
}

// تحميل رصد صف كامل
async function loadGradeMarks(){
  let grade=marks_grade.value;
  let section=marks_section.value;

  let subs=await getSubjects(grade);
  if(!subs.length)return alert("لا توجد مواد لهذا الصف");

  let s=await db.collection("students").where("grade","==",grade).get();
  let students=[];
  s.forEach(d=>{
    let x=d.data();
    if(section && x.section!==section)return;
    students.push(x);
  });

  if(!students.length)return alert("لا يوجد طلاب");

  students.sort((a,b)=>a.name.localeCompare(b.name,"ar"));

  let head="<tr><th>الكود</th><th>الاسم</th>";
  subs.forEach(s=>head+="<th>"+s.name+"</th>");
  head+="<th>حذف</th></tr>";
  grade_marks_head.innerHTML=head;

  grade_marks_body.innerHTML="";
  students.forEach(st=>{
    let row="<tr><td>"+st.code+"</td><td>"+st.name+"</td>";
    subs.forEach(sub=>{
      let val=st.subjects && st.subjects[sub.name] ? st.subjects[sub.name].mark : "";
      row+="<td><input type='number' data-code='"+st.code+"' data-subject='"+sub.name+"' class='gm' value='"+val+"'></td>";
    });
    row+="<td><button class='small-btn btn-danger' onclick='deleteStudent(\""+st.code+"\")'>X</button></td></tr>";
    grade_marks_body.innerHTML+=row;
  });

  grade_marks_table.style.display="table";
  save_grade_marks_btn.style.display="inline-block";
}

// حفظ درجات الصف (إصلاح 100%)
async function saveGradeMarks(){
  let grade=marks_grade.value;
  let subs=await getSubjects(grade);

  let fullMap={};
  subs.forEach(s=>fullMap[s.name]=s.fullMark||0);

  let inputs=document.querySelectorAll(".gm");
  let updated={};
  let batch=db.batch();

  inputs.forEach(inp=>{
    let code=inp.dataset.code;
    let subject=inp.dataset.subject;
    let mark=Number(inp.value)||0;

    if(!updated[code])updated[code]={};
    updated[code][subject]={
      mark:mark,
      fullMark: fullMap[subject] || 0
    };
  });

  Object.keys(updated).forEach(code=>{
    batch.set(db.collection("students").doc(code),{
      subjects:updated[code],
      examType
    },{merge:true});
  });

  await batch.commit();
  alert("تم حفظ الدرجات");
  loadStudents();
}

// تشغيل
initGrades();
loadSettings();
loadStudents();
</script>

</body>
</html>
