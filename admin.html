<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة المشرف - مدارس الفلاح الأهلية</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<style>
body{font-family:Calibri;background:#f4f4f4;margin:0}
.header{background:#1976d2;color:#fff;text-align:center;padding:15px}
.header h1{margin:0;font-size:24px}
.header h2{margin:5px 0 0;font-size:18px;color:#ffeb3b}
.container{max-width:1200px;margin:20px auto;padding:10px}
.box{background:#fff;border-radius:10px;padding:15px;margin-bottom:15px;box-shadow:0 0 8px rgba(0,0,0,0.1)}
h3{margin-top:0;color:#1976d2}
label{display:block;margin-top:5px}
input,select,button{font-family:Calibri;font-size:15px;padding:7px;margin-top:5px;border-radius:6px;border:1px solid #999;box-sizing:border-box}
input,select{width:100%}
button{cursor:pointer;font-weight:bold;border:none}
.btn-primary{background:#1976d2;color:#fff}
.btn-secondary{background:#757575;color:#fff}
.btn-danger{background:#d32f2f;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px}
.col-3{flex:1 1 23%}
.col-4{flex:1 1 30%}
.col-6{flex:1 1 48%}
.col-12{flex:1 1 100%}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
th,td{border:1px solid #ccc;text-align:center;padding:6px}
th{background:#1976d2;color:#fff}
tr:nth-child(even){background:#f9f9f9}
.small-btn{padding:4px 8px;font-size:12px;border-radius:5px}
.sub-table{margin-top:8px;border:1px solid #ccc;border-radius:6px}
.sub-table th{background:#42a5f5}
.badge{display:inline-block;padding:2px 6px;border-radius:10px;font-size:11px;background:#e3f2fd;color:#0d47a1}
.info{font-size:13px;color:#555;margin-top:5px}
</style>
</head>
<body>

<div class="header">
  <h1>مدارس الفلاح الأهلية</h1>
  <h2 id="header_exam">لوحة المشرف - نظام رصد الدرجات</h2>
</div>

<div class="container">

<!-- إدارة الطلاب -->
<div class="box">
  <h3>إدارة الطلاب</h3>

  <div class="row">
    <div class="col-3"><label>بحث بالاسم</label><input id="filter_name"></div>
    <div class="col-3"><label>بحث بالكود</label><input id="filter_code"></div>
    <div class="col-3" style="display:flex;align-items:flex-end">
      <button class="btn-primary" style="width:100%" onclick="loadStudents()">بحث</button>
    </div>
  </div>

  <hr>

  <div class="row">
    <div class="col-3"><label>كود الطالب</label><input id="new_code"></div>
    <div class="col-3"><label>اسم الطالب</label><input id="new_name"></div>
    <div class="col-3"><label>الصف</label><select id="new_grade"></select></div>
    <div class="col-3"><label>الشعبة</label>
      <select id="new_section">
        <option>أ</option><option>ب</option><option>ج</option><option>د</option><option>هـ</option>
      </select>
    </div>
  </div>

  <button class="btn-primary" onclick="addNewStudent()">إضافة طالب</button>

  <button class="btn-danger" onclick="deleteAllStudents()" style="margin-top:10px;width:100%">
    حذف جميع الطلاب
  </button>

  <hr>

  <label>استيراد الطلاب من Excel</label>
  <input type="file" id="students_file" accept=".xlsx,.xls">
  <button class="btn-secondary" style="margin-top:5px" onclick="importStudentsFromExcel()">استيراد الطلاب</button>
</div>

<!-- كشف الطلاب -->
<div class="box">
  <h3>كشف الطلاب</h3>

  <div style="margin-bottom:8px;font-size:14px">
    <span>نوع الاختبار:</span>
    <span id="current_exam_type" class="badge">—</span>
    <button class="btn-secondary" style="float:left" onclick="location='settings.html'">الإعدادات</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>الكود</th>
        <th>الاسم</th>
        <th>الصف</th>
        <th>الشعبة</th>
        <th>إجراءات</th>
      </tr>
    </thead>
    <tbody id="students_body"></tbody>
  </table>
</div>

<!-- رصد صف كامل -->
<div class="box">
  <h3>رصد درجات صف كامل</h3>

  <div class="row">
    <div class="col-3">
      <label>الصف</label>
      <select id="marks_grade"></select>
    </div>

    <div class="col-3">
      <label>الشعبة</label>
      <select id="marks_section">
        <option value="">كل الشعب</option>
        <option>أ</option><option>ب</option><option>ج</option><option>د</option><option>هـ</option>
      </select>
    </div>

    <div class="col-3" style="display:flex;align-items:flex-end">
      <button class="btn-primary" style="width:100%" onclick="loadGradeMarks()">عرض الصف</button>
    </div>
  </div>

  <div id="grade_marks_container" style="margin-top:15px;overflow-x:auto;">
    <table id="grade_marks_table" style="min-width:700px;display:none;">
      <thead id="grade_marks_head"></thead>
      <tbody id="grade_marks_body"></tbody>
    </table>
  </div>

  <button id="save_grade_marks_btn" class="btn-primary" style="margin-top:10px;display:none;" onclick="saveGradeMarks()">
    حفظ درجات الصف
  </button>
</div>

<div class="box">
  <button class="btn-secondary" onclick="exportToExcel()">تصدير Excel</button>
  <button class="btn-secondary" onclick="location='index.html'">الرئيسية</button>
  <button class="btn-secondary" onclick="location='student.html'">صفحة الطالب</button>
</div>

</div>

<script>
var firebaseConfig={
  apiKey:"AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
  authDomain:"all-subjects-14322.firebaseapp.com",
  projectId:"all-subjects-14322",
  storageBucket:"all-subjects-14322.firebasestorage.app",
  messagingSenderId:"813955287168",
  appId:"1:813955287168:web:07efa7dde95b117b9bbe65"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();

var gradesList=[
  "1 ابتدائي","2 ابتدائي","3 ابتدائي","4 ابتدائي","5 ابتدائي","6 ابتدائي",
  "1 متوسط","2 متوسط","3 متوسط",
  "1 ثانوي","2 ثانوي","3 ثانوي"
];

var examType="";

function initGrades(){
  let g1=document.getElementById("new_grade");
  let g2=document.getElementById("marks_grade");
  gradesList.forEach(x=>{
    let o=document.createElement("option");
    o.value=x;o.textContent=x;
    g1.appendChild(o.cloneNode(true));
    g2.appendChild(o.cloneNode(true));
  });
}

async function loadSettings(){
  let s=await db.collection("settings").doc("general").get();
  if(s.exists){
    examType=s.data().examType||"";
    document.getElementById("current_exam_type").innerText=examType||"—";
    if(examType)
      document.getElementById("header_exam").innerText="لوحة المشرف - "+examType;
  }
}

async function addNewStudent(){
  let code=document.getElementById("new_code").value.trim();
  let name=document.getElementById("new_name").value.trim();
  let grade=document.getElementById("new_grade").value;
  let section=document.getElementById("new_section").value;

  if(!code||!name){alert("أدخل الكود والاسم");return;}

  await db.collection("students").doc(code).set(
    {code,name,grade,section,examType,subjects:{}},{merge:true}
  );

  alert("تم إضافة الطالب");
  document.getElementById("new_code").value="";
  document.getElementById("new_name").value="";
  loadStudents();
}

async function deleteAllStudents(){
  if(!confirm("حذف جميع الطلاب؟"))return;
  let snap=await db.collection("students").get();
  let batch=db.batch();
  snap.forEach(d=>batch.delete(d.ref));
  await batch.commit();
  alert("تم الحذف");
  loadStudents();
}

async function deleteStudent(code){
  if(!confirm("حذف الطالب؟"))return;
  await db.collection("students").doc(code).delete();
  loadStudents();
}

async function moveStudent(code){
  let doc=await db.collection("students").doc(code).get();
  if(!doc.exists)return;

  let s=doc.data();
  let g=prompt("الصف الجديد:",s.grade);
  if(!g)return;
  let sec=prompt("الشعبة الجديدة:",s.section);
  if(!sec)return;

  let keep=confirm("الاحتفاظ بالدرجات؟");

  await db.collection("students").doc(code).set({
    grade:g,
    section:sec,
    subjects: keep? s.subjects : {}
  },{merge:true});

  alert("تم النقل");
  loadStudents();
}

async function importStudentsFromExcel(){
  let f=document.getElementById("students_file");
  if(!f.files.length){alert("اختر ملف");return;}

  let reader=new FileReader();
  reader.onload=async e=>{
    let wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
    let ws=wb.Sheets[wb.SheetNames[0]];
    let rows=XLSX.utils.sheet_to_json(ws,{header:1});

    let batch=db.batch();
    rows.forEach((r,i)=>{
      if(i==0)return;
      let code=(r[0]||"").toString().trim();
      let name=(r[1]||"").toString().trim();
      let grade=(r[2]||"").toString().trim();
      let section=(r[3]||"").toString().trim();
      if(!code||!name)return;

      batch.set(db.collection("students").doc(code),{
        code,name,grade,section,examType,subjects:{}
      },{merge:true});
    });

    await batch.commit();
    alert("تم الاستيراد");
    loadStudents();
  };
  reader.readAsArrayBuffer(f.files[0]);
}

async function loadStudents(){
  let fname=document.getElementById("filter_name").value.trim();
  let fcode=document.getElementById("filter_code").value.trim();

  let tbody=document.getElementById("students_body");
  tbody.innerHTML="<tr><td colspan='5'>تحميل...</td></tr>";

  let snap=await db.collection("students").get();
  let list=[];
  snap.forEach(d=>list.push(d.data()));

  list=list.filter(s=>{
    if(fcode && (!s.code || !s.code.includes(fcode)))return false;
    if(fname && (!s.name || !s.name.includes(fname)))return false;
    return true;
  });

  list.sort((a,b)=>a.name.localeCompare(b.name));

  tbody.innerHTML="";
  if(!list.length){
    tbody.innerHTML="<tr><td colspan='5'>لا يوجد طلاب</td></tr>";
    return;
  }

  list.forEach(s=>{
    let tr=document.createElement("tr");
    tr.innerHTML=
      "<td>"+s.code+"</td>"+
      "<td>"+s.name+"</td>"+
      "<td>"+s.grade+"</td>"+
      "<td>"+s.section+"</td>"+
      "<td>"+
        "<button class='small-btn btn-primary' onclick='moveStudent(\""+s.code+"\")'>نقل</button> "+
        "<button class='small-btn btn-danger' onclick='deleteStudent(\""+s.code+"\")'>حذف</button>"+
      "</td>";
    tbody.appendChild(tr);
  });
}

async function loadGradeMarks(){
  let grade=document.getElementById("marks_grade").value;
  let sec=document.getElementById("marks_section").value;

  let head=document.getElementById("grade_marks_head");
  let body=document.getElementById("grade_marks_body");
  let table=document.getElementById("grade_marks_table");

  head.innerHTML="";
  body.innerHTML="";
  table.style.display="none";
  document.getElementById("save_grade_marks_btn").style.display="none";

  if(!grade){alert("اختر الصف");return;}

  let subsDoc=await db.collection("settings").doc("subjects_"+grade).get();
  if(!subsDoc.exists || !subsDoc.data().subjects.length){
    alert("لا توجد مواد لهذا الصف");
    return;
  }
  let subs=subsDoc.data().subjects;

  let snap=await db.collection("students").where("grade","==",grade).get();
  let students=[];
  snap.forEach(d=>{
    let s=d.data();
    if(sec && s.section!==sec)return;
    students.push(s);
  });

  if(!students.length){
    alert("لا يوجد طلاب");
    return;
  }

  students.sort((a,b)=>a.name.localeCompare(b.name));

  let h="<tr><th>الكود</th><th>الاسم</th>";
  subs.forEach(s=>h+="<th>"+s.name+"</th>");
  h+="<th>إجراءات</th></tr>";
  head.innerHTML=h;

  students.forEach(st=>{
    let row="<tr><td>"+st.code+"</td><td>"+st.name+"</td>";
    subs.forEach(sub=>{
      let val=st.subjects && st.subjects[sub.name] ? st.subjects[sub.name].mark : "";
      row+="<td><input type='number' data-code='"+st.code+"' data-subject='"+sub.name+"' value='"+val+"' class='gm'></td>";
    });
    row+="<td><button class='small-btn btn-danger' onclick='deleteStudent(\""+st.code+"\")'>حذف</button></td></tr>";
    body.innerHTML+=row;
  });

  table.style.display="table";
  document.getElementById("save_grade_marks_btn").style.display="inline-block";
}

async function saveGradeMarks(){
  let inputs=document.querySelectorAll(".gm");
  let batch=db.batch();
  let updated={};

  inputs.forEach(inp=>{
    let code=inp.dataset.code;
    let subject=inp.dataset.subject;
    let mark=Number(inp.value)||0;

    if(!updated[code])updated[code]={};

    let full = subs.find(x => x.name === subject)?.fullMark || 0;

updated[code][subject] = {
    mark: mark,
    fullMark: full
};

  });

  Object.keys(updated).forEach(code=>{
    batch.set(db.collection("students").doc(code),{
      subjects:updated[code],examType
    },{merge:true});
  });

  await batch.commit();
  alert("تم حفظ الدرجات");
  loadStudents();
}

function exportToExcel(){
  let rows=[["الكود","الاسم","الصف","الشعبة"]];
  document.querySelectorAll("#students_body tr").forEach(tr=>{
    let t=tr.children;
    rows.push([t[0].innerText,t[1].innerText,t[2].innerText,t[3].innerText]);
  });

  let ws=XLSX.utils.aoa_to_sheet(rows);
  let wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Students");
  XLSX.writeFile(wb,"students.xlsx");
}

initGrades();
loadSettings();
loadStudents();
</script>

</body>
</html>
