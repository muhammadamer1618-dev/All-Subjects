<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>دخول المعلم - مدارس الفلاح الأهلية</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
body{font-family:Calibri;background:#f4f4f4;margin:0;padding:20px}
.container{max-width:400px;margin:60px auto;background:white;padding:20px;border-radius:12px;box-shadow:0 0 10px rgba(0,0,0,0.2);text-align:center}
h1{color:#1976d2;margin-bottom:20px}
label{display:block;margin-top:10px;font-weight:bold}
input{padding:8px;font-size:16px;width:100%;border-radius:8px;border:1px solid #999;margin-top:5px}
button{margin-top:15px;padding:10px 20px;border:none;border-radius:8px;background:#1976d2;color:white;font-size:16px;font-weight:bold;cursor:pointer;width:100%}
button:hover{opacity:0.9}
.info{margin-top:15px;font-size:14px;color:#555}
</style>
</head>
<body>

<div class="container">
  <h1>دخول المعلم</h1>

  <label>كود المعلم</label>
  <input id="t_code" placeholder="مثال: T001">

  <label>كلمة المرور</label>
  <input id="t_password" type="password" placeholder="******">

  <button onclick="loginTeacher()">دخول</button>

  <div class="info">
    يتم الحصول على كود المعلم والصلاحيات من لوحة المشرف.
  </div>

  <div style="margin-top:10px">
    <button onclick="location='index.html'" style="background:#757575">الصفحة الرئيسية</button>
  </div>
</div>

<script>
var firebaseConfig={
  apiKey:"AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
  authDomain:"all-subjects-14322.firebaseapp.com",
  projectId:"all-subjects-14322",
  storageBucket:"all-subjects-14322.firebasestorage.app",
  messagingSenderId:"813955287168",
  appId:"1:813955287168:web:07efa7dde95b117b9bbe65"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();

async function loginTeacher(){
  let code=document.getElementById("t_code").value.trim();
  let password=document.getElementById("t_password").value.trim();
  if(!code || !password){
    alert("أدخل كود المعلم وكلمة المرور");
    return;
  }

  let doc=await db.collection("teachers").doc(code).get();
  if(!doc.exists){
    alert("المعلم غير موجود");
    return;
  }

  let d=doc.data();
  if((d.password||"")!==password){
    alert("كلمة المرور غير صحيحة");
    return;
  }

  localStorage.setItem("teacher_code", d.code);
  location="teacher.html";
}
</script>

</body>
</html>
