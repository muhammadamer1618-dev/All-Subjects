<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نتيجة الطالب - مدارس الفلاح الأهلية</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
body{font-family:Calibri;background:#f4f4f4;margin:0}
.container{
  max-width:900px;
  margin:30px auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
  box-shadow:0 0 8px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
  color:#1976d2;
  margin-bottom:5px;
}
h2{
  text-align:center;
  color:#444;
  margin-top:0;
}

label{display:block;margin-top:10px;font-weight:bold}
input{
  width:100%;
  padding:8px;
  border:1px solid #777;
  border-radius:6px;
  margin-top:5px;
  font-size:16px;
}
button{
  margin-top:15px;
  width:100%;
  padding:10px;
  background:#1976d2;
  color:#fff;
  border:none;
  font-size:17px;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  font-size:17px;
}
th,td{
  border:1px solid #000;
  padding:8px;
  text-align:center;
}
th{
  background:#1976d2;
  color:#fff;
}

#footer{
  text-align:center;
  margin-top:20px;
  color:#1976d2;
  font-weight:bold;
  font-size:15px;
}

/* الطباعة */
@media print{
  button,#search_box{
    display:none;
  }
  body{
    background:#fff;
  }
  .container{
    box-shadow:none;
    border:0;
  }
}
</style>

</head>
<body>

<div class="container">

  <h1>مدارس الفلاح الأهلية</h1>
  <h2 id="exam_title">نتيجة الطالب</h2>

  <!-- البحث -->
  <div id="search_box">
    <label>أدخل كود الطالب</label>
    <input id="code_input" placeholder="مثال: 1022">
    <button onclick="loadResult()">عرض النتيجة</button>
  </div>

  <!-- بيانات الطالب -->
  <div id="student_info" style="display:none; margin-top:15px;">
    <table>
      <tr><th>الاسم</th><td id="s_name" style="color:#d32f2f; font-weight:bold;"></td></tr>
      <tr><th>الصف</th><td id="s_grade" style="color:#1976d2; font-weight:bold;"></td></tr>
      <tr><th>الشعبة</th><td id="s_section" style="color:#1976d2; font-weight:bold;"></td></tr>
      <tr><th>نوع الاختبار</th><td id="s_exam" style="color:#d32f2f; font-weight:bold;"></td></tr>
    </table>
  </div>

  <!-- جدول الدرجات -->
  <table id="marks_table" style="display:none;">
    <thead>
      <tr>
        <th>المادة</th>
        <th>درجة الطالب</th>
      </tr>
    </thead>
    <tbody id="marks_body"></tbody>
  </table>

  <!-- جدول التوقيع -->
  <div id="sign_table" style="display:none; margin-top:20px; display:flex; justify-content:center;">
    <table style="border-collapse:collapse; width:70%; font-size:18px;">
      <tr>
        <th style="border:1px solid #000; padding:8px; background:#1976d2; color:#fff;">
          رئيس قسم الإشراف التربوي
        </th>
        <td style="border:1px solid #000; padding:8px; font-weight:bold;">
          أحمد سمير عباس
        </td>
      </tr>
      <tr>
        <th style="border:1px solid #000; padding:8px; background:#1976d2; color:#fff;">
          مدير المدرسة
        </th>
        <td style="border:1px solid #000; padding:8px; font-weight:bold;">
          سعيد بن علي الجمعان
        </td>
      </tr>
    </table>
  </div>

  <button id="print_btn" style="display:none;" onclick="window.print()">طباعة النتيجة</button>

  <div id="footer">تصميم محمد عامر أحمد</div>

</div>

<script>
var firebaseConfig={
  apiKey:"AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
  authDomain:"all-subjects-14322.firebaseapp.com",
  projectId:"all-subjects-14322",
  storageBucket:"all-subjects-14322.firebasestorage.app",
  messagingSenderId:"813955287168",
  appId:"1:813955287168:web:07efa7dde95b117b9bbe65"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();

async function loadResult(){
  let code=document.getElementById("code_input").value.trim();
  if(!code){
    alert("أدخل كود الطالب");
    return;
  }

  let doc=await db.collection("students").doc(code).get();

  if(!doc.exists){
    alert("الطالب غير موجود");
    return;
  }

  let s=doc.data();

  document.getElementById("student_info").style.display="block";
  document.getElementById("marks_table").style.display="table";
  document.getElementById("sign_table").style.display="flex";
  document.getElementById("print_btn").style.display="block";

  document.getElementById("s_name").innerText=s.name||"—";
  document.getElementById("s_grade").innerText=s.grade||"—";
  document.getElementById("s_section").innerText=s.section||"—";
  document.getElementById("s_exam").innerText=s.examType||"—";

  document.getElementById("exam_title").innerText="نتيجة الطالب - "+(s.examType||"");

  let tbody=document.getElementById("marks_body");
  tbody.innerHTML="";

  if(!s.subjects || Object.keys(s.subjects).length===0){
    tbody.innerHTML="<tr><td colspan='2'>لم يتم رصد الدرجات حتى الآن</td></tr>";
    return;
  }

  Object.keys(s.subjects).forEach(sub=>{
    let m=s.subjects[sub].mark||0;

    tbody.innerHTML+=
      "<tr>"+
        "<td>"+sub+"</td>"+
        "<td style='font-weight:bold;color:#d32f2f'>"+m+"</td>"+
      "</tr>";
  });
}
</script>

</body>
</html>
