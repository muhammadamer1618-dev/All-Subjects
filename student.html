<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>شهادة الطالب - مدارس الفلاح الأهلية</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
body{
  font-family: Calibri;
  background: #eef2f7;
  margin:0;
  padding:0;
}
.header{
  background:#1976d2;
  color:#fff;
  text-align:center;
  padding:15px;
}
.header h1{
  margin:0;
  font-size:24px;
}
.header h2{
  margin:5px 0 0;
  font-size:18px;
  color:#ffeb3b;
}
.container{
  max-width:900px;
  margin:25px auto;
  background:#fff;
  border-radius:15px;
  box-shadow:0 0 12px rgba(0,0,0,0.15);
  padding:25px;
}
.info{
  background:#e3f2fd;
  border-radius:10px;
  padding:15px;
  margin-bottom:15px;
}
.info label{
  font-weight:bold;
  color:#0d47a1;
  display:inline-block;
  width:130px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border:1px solid #aaa;
  text-align:center;
  padding:8px;
}
th{
  background:#1976d2;
  color:#fff;
}
tfoot td{
  background:#f5f5f5;
  font-weight:bold;
}
input,button{
  font-family: Calibri;
  font-size:16px;
  padding:10px;
  border-radius:6px;
  border:1px solid #999;
}
input{
  width:60%;
}
button{
  background:#1976d2;
  color:#fff;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
button:hover{
  opacity:0.9;
}
.center{
  text-align:center;
}
.footer{
  text-align:left;
  font-size:13px;
  margin-top:25px;
  color:#1976d2;
  font-weight:bold;
}
</style>
</head>
<body>

<div class="header">
  <h1>مدارس الفلاح الأهلية</h1>
  <h2>شهادة درجات الطالب</h2>
</div>

<div class="container">

  <div class="center" style="margin-bottom:20px;">
    <input id="studentCode" placeholder="أدخل كود الطالب">
    <button onclick="loadStudent()">عرض النتيجة</button>
  </div>

  <div id="studentInfo" class="info" style="display:none;">
    <p><label>كود الطالب:</label><span id="code"></span></p>
    <p><label>اسم الطالب:</label><span id="name"></span></p>
    <p><label>الصف:</label><span id="grade"></span></p>
    <p><label>الشعبة:</label><span id="section"></span></p>
  </div>

  <table id="marksTable" style="display:none;">
    <thead>
      <tr>
        <th>المادة</th>
        <th>نوع الاختبار</th>
        <th>الدرجة النهائية</th>
        <th>درجة الطالب</th>
        <th>التقدير</th>
        <th>اسم المعلم</th>
        <th>مشرف المادة</th>
      </tr>
    </thead>
    <tbody id="marksBody"></tbody>
    <tfoot>
      <tr>
        <td colspan="2">المجموع الكلي</td>
        <td id="fullTotal">0</td>
        <td id="totalMarks">0</td>
        <td colspan="3" id="overallRating">—</td>
      </tr>
    </tfoot>
  </table>

  <div id="noData" class="center" style="display:none;color:#d32f2f;margin-top:20px;">
    لا توجد بيانات للطالب المدخل.
  </div>

  <div class="footer">
    تصميم محمد عامر أحمد
  </div>
</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
  authDomain: "all-subjects-14322.firebaseapp.com",
  projectId: "all-subjects-14322",
  storageBucket: "all-subjects-14322.firebasestorage.app",
  messagingSenderId: "813955287168",
  appId: "1:813955287168:web:07efa7dde95b117b9bbe65"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

function calcRating(m, f){
  m = Number(m); f = Number(f);
  if(!m || !f) return "—";
  let p = (m/f)*100;
  if(p >= 90) return "ممتاز";
  if(p >= 80) return "جيد جدًا";
  if(p >= 70) return "جيد";
  if(p >= 60) return "مقبول";
  return "ضعيف";
}

async function loadStudent(){
  const code = document.getElementById("studentCode").value.trim();
  if(!code){ alert("أدخل كود الطالب"); return; }

  try{
    const doc = await db.collection("students").doc(code).get();
    if(!doc.exists){
      document.getElementById("studentInfo").style.display = "none";
      document.getElementById("marksTable").style.display = "none";
      document.getElementById("noData").style.display = "block";
      return;
    }

    const s = doc.data();
    document.getElementById("studentInfo").style.display = "block";
    document.getElementById("marksTable").style.display = "table";
    document.getElementById("noData").style.display = "none";

    document.getElementById("code").innerText = s.code || code;
    document.getElementById("name").innerText = s.name || "";
    document.getElementById("grade").innerText = s.grade || "";
    document.getElementById("section").innerText = s.section || "";

    const tbody = document.getElementById("marksBody");
    tbody.innerHTML = "";

    let total = 0;
    let full = 0;

    if(s.subjects){
      Object.keys(s.subjects).forEach(sub=>{
        const d = s.subjects[sub];
        const m = Number(d.mark)||0;
        const f = Number(d.fullMark)||0;
        total += m;
        full += f;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${sub}</td>
          <td>${d.exam||""}</td>
          <td>${f}</td>
          <td>${m}</td>
          <td>${calcRating(m,f)}</td>
          <td>${d.teacher||""}</td>
          <td>${d.supervisor||""}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById("fullTotal").innerText = full;
    document.getElementById("totalMarks").innerText = total;
    document.getElementById("overallRating").innerText = full>0 ? calcRating(total, full) : "—";

  }catch(e){
    alert("خطأ أثناء تحميل البيانات");
    console.log(e);
  }
}
</script>

</body>
</html>
