<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>شهادة الطالب - مدارس الفلاح الأهلية</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
body {
  font-family: Calibri;
  background: #f4f4f4;
  margin: 0;
  padding: 20px;
}
.container {
  max-width: 900px;
  margin: auto;
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 10px rgba(0,0,0,0.15);
}
.header {
  text-align: center;
  color: #0d47a1;
}
.school-title {
  font-size: 28px;
  font-weight: bold;
}
.exam-title {
  font-size: 20px;
  margin-top: 5px;
  color: #d32f2f;
  font-weight: bold;
}

label { display: block; margin-top: 10px; font-weight: bold; }
input {
  width: 100%;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #999;
  font-size: 18px;
}
button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  font-size: 18px;
  background: #1976d2;
  color: #fff;
  cursor: pointer;
}
button:hover { opacity: 0.9; }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
  font-size: 18px;
}
th, td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: center;
}
th {
  background: #1976d2;
  color: #fff;
}

.name-table {
  margin-top: 15px;
  font-size: 18px;
  width: 100%;
  border: 2px solid #1976d2;
}
.name-table td {
  padding: 10px;
  font-weight: bold;
  color: #d32f2f;
}

.footer-sign {
  margin-top: 40px;
  display: flex;
  justify-content: space-between;
  font-size: 18px;
}
.footer-sign div {
  font-weight: bold;
  color: #0d47a1;
}

.print-btn {
  background: #388e3c;
  margin-top: 25px;
}

.designer {
  text-align: center;
  margin-top: 25px;
  color: #0d47a1;
  font-weight: bold;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="school-title">مدارس الفلاح الأهلية</div>
    <div id="exam_title" class="exam-title"></div>
  </div>

  <label>أدخل كود الطالب</label>
  <input id="student_code" placeholder="مثال: 1001">

  <button onclick="loadStudent()">عرض النتيجة</button>

  <table class="name-table" id="info_table" style="display:none;">
    <tr><td>اسم الطالب: <span id="st_name"></span></td></tr>
    <tr><td>الصف: <span id="st_grade"></span> — الشعبة: <span id="st_section"></span></td></tr>
  </table>

  <table id="marks_table" style="display:none;">
    <thead>
      <tr>
        <th>المادة</th>
        <th>الدرجة النهائية</th>
        <th>درجة الطالب</th>
        <th>التقدير</th>
      </tr>
    </thead>
    <tbody id="marks_body"></tbody>
  </table>

  <div class="footer-sign" id="sign_area" style="display:none;">
    <div>رئيس قسم الإشراف التربوي<br>أحمد سمير عباس</div>
    <div>مدير المدرسة<br>سعيد بن علي الجمعان</div>
  </div>

  <button class="print-btn" id="print_btn" style="display:none;" onclick="window.print()">طباعة الشهادة</button>

  <div class="designer">تصميم محمد عامر أحمد</div>

</div>

<script>
// Firebase
var firebaseConfig = {
  apiKey:"AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
  authDomain:"all-subjects-14322.firebaseapp.com",
  projectId:"all-subjects-14322",
  storageBucket:"all-subjects-14322.firebasestorage.app",
  messagingSenderId:"813955287168",
  appId:"1:813955287168:web:07efa7dde95b117b9bbe65"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

function calcRating(m, f) {
  m = Number(m); f = Number(f);
  if (!m || !f) return "";
  let p = (m/f) * 100;
  if (p >= 90) return "ممتاز";
  if (p >= 80) return "جيد جدًا";
  if (p >= 70) return "جيد";
  if (p >= 60) return "مقبول";
  return "ضعيف";
}

async function loadStudent() {
  let code = document.getElementById("student_code").value.trim();
  if (!code) {
    alert("أدخل كود الطالب");
    return;
  }

  let doc = await db.collection("students").doc(code).get();
  if (!doc.exists) {
    alert("الطالب غير موجود");
    return;
  }

  let st = doc.data();

  // جلب اسم الاختبار
  let general = await db.collection("settings").doc("general").get();
  if (general.exists) {
    document.getElementById("exam_title").innerText = general.data().examType || "";
  }

  // عرض بيانات الطالب
  document.getElementById("info_table").style.display = "table";
  document.getElementById("st_name").innerText = st.name || "";
  document.getElementById("st_grade").innerText = st.grade || "";
  document.getElementById("st_section").innerText = st.section || "";

  // جلب مواد الصف
  let subDoc = await db.collection("settings").doc("subjects_" + st.grade).get();
  if (!subDoc.exists) {
    alert("لم يتم إعداد مواد لهذا الصف بعد");
    return;
  }

  let template = subDoc.data().subjects || [];

  // تجهيز جدول الدرجات
  let body = document.getElementById("marks_body");
  body.innerHTML = "";

  let subs = st.subjects || {};

  template.forEach(t => {
    let subName = t.name;
    let full = t.fullMark; // الدرجة النهائية الصحيحة من settings
    let mark = subs[subName] ? subs[subName].mark : "";
    let rating = calcRating(mark, full);

    let tr = document.createElement("tr");
    tr.innerHTML =
      "<td>" + subName + "</td>" +
      "<td>" + full + "</td>" +
      "<td>" + mark + "</td>" +
      "<td>" + rating + "</td>";
    body.appendChild(tr);
  });

  document.getElementById("marks_table").style.display = "table";
  document.getElementById("sign_area").style.display = "flex";
  document.getElementById("print_btn").style.display = "block";
}
</script>

</body>
</html>
