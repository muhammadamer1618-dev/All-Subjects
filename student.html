<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>شهادة الطالب - مدارس الفلاح الأهلية</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
body{font-family:Calibri;background:#f4f4f4;margin:0;padding:0}
.header{text-align:center;padding:20px;background:#1976d2;color:#fff}
.container{max-width:1000px;margin:20px auto;background:#fff;padding:20px;border-radius:10px;box-shadow:0 0 8px rgba(0,0,0,0.15)}

table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #ccc;padding:8px;text-align:center;font-size:16px}
th{background:#1976d2;color:#fff;font-size:17px}
.section-title{background:#0d47a1;color:#fff;padding:8px;border-radius:6px;text-align:center;margin-top:25px;font-size:18px;font-weight:bold}

.footer-table td{background:#e3f2fd;font-weight:bold}
</style>
</head>
<body>

<div class="header">
  <h1 id="exam_title">نتيجة الطالب</h1>
</div>

<div class="container">

  <!-- بيانات الطالب -->
  <div class="section-title">بيانات الطالب</div>
  <table>
    <tbody>
      <tr><th>الكود</th><td id="st_code"></td></tr>
      <tr><th>الاسم</th><td id="st_name"></td></tr>
      <tr><th>الصف</th><td id="st_grade"></td></tr>
      <tr><th>الشعبة</th><td id="st_section"></td></tr>
    </tbody>
  </table>

  <!-- جدول المواد -->
  <div class="section-title">النتيجة التفصيلية</div>
  <table id="subjects_table">
    <thead>
      <tr>
        <th>المادة</th>
        <th>درجة الطالب</th>
        <th>الدرجة النهائية</th>
        <th>التقدير</th>
      </tr>
    </thead>
    <tbody id="subs_body"></tbody>
  </table>

  <!-- المجموع النهائي -->
  <div class="section-title">المجموع النهائي</div>
  <table>
    <tbody>
      <tr><th>مجموع درجات الطالب</th><td id="total_marks"></td></tr>
      <tr><th>الدرجة الكلية</th><td id="full_marks"></td></tr>
      <tr><th>التقدير العام</th><td id="final_rating"></td></tr>
    </tbody>
  </table>

  <!-- التوقيعات -->
  <div class="section-title">التوقيعات</div>
  <table class="footer-table">
    <tbody>
      <tr><th>رئيس قسم الإشراف والتدريب</th><td>أحمد سمير عباس</td></tr>
      <tr><th>مدير المدرسة</th><td>سعيد بن علي الجمعان</td></tr>
    </tbody>
  </table>

</div>

<script>
var firebaseConfig={
  apiKey:"AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
  authDomain:"all-subjects-14322.firebaseapp.com",
  projectId:"all-subjects-14322",
  storageBucket:"all-subjects-14322.firebasestorage.app",
  messagingSenderId:"813955287168",
  appId:"1:813955287168:web:07efa7dde95b117b9bbe65"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();

function calcRating(mark,full){
  if(full===0)return "";
  let p=(mark/full)*100;
  if(p>=90) return "ممتاز";
  if(p>=80) return "جيد جدًا";
  if(p>=70) return "جيد";
  if(p>=60) return "مقبول";
  return "ضعيف";
}

async function loadStudent(){
  let code=prompt("أدخل كود الطالب:");
  if(!code)return;

  let doc=await db.collection("students").doc(code).get();
  if(!doc.exists){
    alert("الكود غير موجود");
    return;
  }

  let s=doc.data();
  document.getElementById("st_code").innerText=s.code;
  document.getElementById("st_name").innerText=s.name;
  document.getElementById("st_grade").innerText=s.grade;
  document.getElementById("st_section").innerText=s.section;
  document.getElementById("exam_title").innerText=s.examType || "نتيجة الطالب";

  let subs=s.subjects||{};
  let body=document.getElementById("subs_body");
  body.innerHTML="";

  let total=0, full=0;

  Object.keys(subs).forEach(sub=>{
    let m=subs[sub].mark||0;
    let f=subs[sub].fullMark||0;
    total+=m;
    full+=f;

    let tr=document.createElement("tr");
    tr.innerHTML=
      "<td>"+sub+"</td>"+
      "<td>"+m+"</td>"+
      "<td>"+f+"</td>"+
      "<td>"+calcRating(m,f)+"</td>";
    body.appendChild(tr);
  });

  document.getElementById("total_marks").innerText=total;
  document.getElementById("full_marks").innerText=full;
  document.getElementById("final_rating").innerText=calcRating(total,full);
}

loadStudent();
</script>

</body>
</html>
