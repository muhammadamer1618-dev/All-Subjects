<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>شهادة الطالب - مدارس الفلاح الأهلية</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
body{
  font-family: Calibri;
  background:#eef2f7;
  margin:0;
  padding:0;
}
.header{
  background:#1976d2;
  color:#fff;
  text-align:center;
  padding:15px;
}
.header h1{margin:0;font-size:28px;}
.header h2{margin:5px 0 0;font-size:20px;color:#ffeb3b;}
.exam-title{
  text-align:center;
  font-size:22px;
  color:#d32f2f;
  font-weight:bold;
  margin-top:10px;
}
.container{
  max-width:900px;
  margin:25px auto;
  background:#fff;
  border-radius:15px;
  box-shadow:0 0 12px rgba(0,0,0,0.15);
  padding:25px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border:1px solid #aaa;
  text-align:center;
  padding:8px;
}
th{
  background:#1976d2;
  color:#fff;
}
tfoot td{
  background:#f5f5f5;
  font-weight:bold;
}
.info-table{
  width:100%;
  margin-bottom:20px;
  border-collapse:collapse;
}
.info-table th, .info-table td{
  border:1px solid #1976d2;
  padding:10px;
  text-align:center;
}
.info-table th{
  color:#d32f2f; /* titles in red */
  font-weight:bold;
}
.info-table td{
  color:#0d47a1; /* values in dark blue */
  font-weight:bold;
}
.center{text-align:center;}
input,button{
  font-family: Calibri;
  font-size:16px;
  padding:10px;
  border-radius:6px;
  border:1px solid #999;
}
input{width:60%;}
button{
  background:#1976d2;
  color:#fff;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
button:hover{opacity:0.9;}
.footer{
  text-align:left;
  font-size:13px;
  margin-top:25px;
  color:#1976d2;
  font-weight:bold;
}
.print-btn{
  display:block;
  margin:20px auto;
  background:#388e3c;
  color:#fff;
  font-size:18px;
  border:none;
  border-radius:8px;
  padding:10px 20px;
  cursor:pointer;
}
@media print{
  .header, .print-btn, input, button {display:none;}
  .container{box-shadow:none;margin:0;}
}
</style>
</head>
<body>

<div class="header">
  <h1>مدارس الفلاح الأهلية</h1>
  <h2 id="examTitle">شهادة درجات الطالب</h2>
</div>

<div class="container" id="certificate">

  <div class="center" style="margin-bottom:20px;">
    <input id="studentCode" placeholder="أدخل كود الطالب">
    <button onclick="loadStudent()">عرض النتيجة</button>
  </div>

  <table id="infoTable" class="info-table" style="display:none;">
    <tr><th>كود الطالب</th><td id="code"></td></tr>
    <tr><th>اسم الطالب</th><td id="name"></td></tr>
    <tr><th>الصف</th><td id="grade"></td></tr>
    <tr><th>الشعبة</th><td id="section"></td></tr>
  </table>

  <table id="marksTable" style="display:none;">
    <thead>
      <tr>
        <th>المادة</th>
        <th>نوع الاختبار</th>
        <th>الدرجة النهائية</th>
        <th>درجة الطالب</th>
        <th>التقدير</th>
        <th>اسم المعلم</th>
        <th>مشرف المادة</th>
      </tr>
    </thead>
    <tbody id="marksBody"></tbody>
    <tfoot>
      <tr>
        <td colspan="2">المجموع الكلي</td>
        <td id="fullTotal">0</td>
        <td id="totalMarks">0</td>
        <td colspan="3" id="overallRating">—</td>
      </tr>
    </tfoot>
  </table>

  <button class="print-btn" onclick="window.print()">🖨️ طباعة الشهادة</button>

  <div class="footer">تصميم محمد عامر أحمد</div>

</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
  authDomain: "all-subjects-14322.firebaseapp.com",
  projectId: "all-subjects-14322",
  storageBucket: "all-subjects-14322.firebasestorage.app",
  messagingSenderId: "813955287168",
  appId: "1:813955287168:web:07efa7dde95b117b9bbe65"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

function calcRating(m,f){
  m=Number(m);f=Number(f);
  if(!m||!f)return"—";
  let p=(m/f)*100;
  if(p>=90)return"ممتاز";
  if(p>=80)return"جيد جدًا";
  if(p>=70)return"جيد";
  if(p>=60)return"مقبول";
  return"ضعيف";
}

async function loadStudent(){
  const code=document.getElementById("studentCode").value.trim();
  if(!code){alert("أدخل كود الطالب");return;}
  try{
    const doc=await db.collection("students").doc(code).get();
    if(!doc.exists){
      alert("لا توجد بيانات لهذا الطالب");
      return;
    }

    const s=doc.data();
    document.getElementById("infoTable").style.display="table";
    document.getElementById("marksTable").style.display="table";

    document.getElementById("code").innerText=s.code||code;
    document.getElementById("name").innerText=s.name||"";
    document.getElementById("grade").innerText=s.grade||"";
    document.getElementById("section").innerText=s.section||"";

    // عنوان الاختبار
    let firstExam = "شهادة درجات الطالب";
    if(s.subjects){
      const firstKey = Object.keys(s.subjects)[0];
      if(firstKey && s.subjects[firstKey].exam){
        firstExam = "نتائج " + s.subjects[firstKey].exam;
      }
    }
    document.getElementById("examTitle").innerText = firstExam;

    const tbody=document.getElementById("marksBody");
    tbody.innerHTML="";
    let total=0,full=0;

    if(s.subjects){
      Object.keys(s.subjects).forEach(sub=>{
        const d=s.subjects[sub];
        const m=Number(d.mark)||0;
        const f=Number(d.fullMark)||0;
        total+=m;full+=f;
        const tr=document.createElement("tr");
        tr.innerHTML=`
          <td>${sub}</td>
          <td>${d.exam||""}</td>
          <td>${f}</td>
          <td>${m}</td>
          <td>${calcRating(m,f)}</td>
          <td>${d.teacher||""}</td>
          <td>${d.supervisor||""}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById("fullTotal").innerText=full;
    document.getElementById("totalMarks").innerText=total;
    document.getElementById("overallRating").innerText=full>0?calcRating(total,full):"—";

  }catch(e){
    alert("حدث خطأ أثناء تحميل البيانات");
    console.log(e);
  }
}
</script>

</body>
</html>
