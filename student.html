<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>شهادة الطالب - مدارس الفلاح الأهلية</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
body{
  font-family:Calibri;
  background:#f4f4f4;
  margin:0;
  padding:0;
}
.container{
  max-width:900px;
  margin:20px auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 0 10px rgba(0,0,0,0.15);
}
h1,h2,h3{text-align:center;margin:0}
.title-main{color:#1976d2;font-size:28px;font-weight:bold}
.exam-type{color:#d32f2f;margin-top:5px;font-size:20px}

label{display:block;margin-top:10px}
input{
  width:100%;
  padding:10px;
  font-size:18px;
  border:1px solid #999;
  border-radius:6px;
  margin-top:5px;
}
button{
  width:100%;
  padding:12px;
  background:#1976d2;
  color:white;
  border:none;
  font-size:18px;
  margin-top:10px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}
button:hover{opacity:0.9}

.table-box{
  margin-top:20px;
  border:2px solid #1976d2;
  border-radius:10px;
  padding:15px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}
th{
  background:#1976d2;
  color:white;
}

.red-text{color:#d32f2f;font-weight:bold}
.blue-text{color:#1976d2;font-weight:bold}

.footer-sign{
  margin-top:25px;
  display:flex;
  justify-content:space-between;
  font-size:18px;
  font-weight:bold;
  color:#333;
}

.print-btn{
  background:#388e3c;
}
.designer{
  text-align:center;
  margin-top:15px;
  font-size:14px;
  color:#1976d2;
  font-weight:bold;
}

@media print{
  button,#search_section{display:none}
  body{background:white}
  .container{box-shadow:none;border:none}
  .designer{margin-top:40px}
}
</style>
</head>
<body>

<div class="container">

  <h1 class="title-main">مدارس الفلاح الأهلية</h1>
  <h2 id="exam_title" class="exam-type"></h2>

  <div id="search_section">
    <label>أدخل كود الطالب</label>
    <input id="student_code" placeholder="مثال: 1001">
    <button onclick="loadStudent()">عرض النتيجة</button>
  </div>

  <div id="result_section" style="display:none">

    <div class="table-box">
      <h3>بيانات الطالب</h3>

      <table>
        <tr>
          <th>الاسم</th>
          <td class="red-text" id="st_name"></td>
        </tr>
        <tr>
          <th>الصف</th>
          <td class="blue-text" id="st_grade"></td>
        </tr>
        <tr>
          <th>الشعبة</th>
          <td class="red-text" id="st_section"></td>
        </tr>
      </table>
    </div>

    <div class="table-box">
      <h3>الدرجات</h3>
      <table>
        <thead>
          <tr>
            <th>المادة</th>
            <th>الدرجة النهائية</th>
            <th>درجة الطالب</th>
            <th>التقدير</th>
          </tr>
        </thead>
        <tbody id="subjects_table"></tbody>
      </table>
    </div>

    <div class="table-box">
      <h3>المجموع والتقدير العام</h3>
      <table>
        <tr>
          <th>المجموع</th>
          <td class="blue-text" id="total_marks"></td>
        </tr>
        <tr>
          <th>التقدير العام</th>
          <td class="red-text" id="overall_rating"></td>
        </tr>
      </table>
    </div>

    <div class="footer-sign">
      <div>رئيس قسم الإشراف التربوي<br>أحمد سمير عباس</div>
      <div>مدير المدرسة<br>سعيد بن علي الجمعان</div>
    </div>

    <button class="print-btn" onclick="print()">طباعة</button>

    <div class="designer">تصميم محمد عامر أحمد</div>

  </div>

</div>

<script>

// Firebase
var firebaseConfig = {
  apiKey:"AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
  authDomain:"all-subjects-14322.firebaseapp.com",
  projectId:"all-subjects-14322",
  storageBucket:"all-subjects-14322.firebasestorage.app",
  messagingSenderId:"813955287168",
  appId:"1:813955287168:web:07efa7dde95b117b9bbe65"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();

async function loadExamType(){
  let doc=await db.collection("settings").doc("general").get();
  if(doc.exists){
    let t=doc.data().examType||"";
    document.getElementById("exam_title").innerText=t;
  }
}
loadExamType();

function calcRating(m,f){
  m=Number(m);f=Number(f);
  if(!m||!f)return"";
  let p=(m/f)*100;
  if(p>=90)return"ممتاز";
  if(p>=80)return"جيد جدًا";
  if(p>=70)return"جيد";
  if(p>=60)return"مقبول";
  return"ضعيف";
}

async function loadStudent(){
  let code=document.getElementById("student_code").value.trim();
  if(!code){alert("أدخل كود الطالب");return;}

  let doc=await db.collection("students").doc(code).get();
  if(!doc.exists){alert("الطالب غير موجود");return;}

  let s=doc.data();

  document.getElementById("result_section").style.display="block";

  document.getElementById("st_name").innerText=s.name;
  document.getElementById("st_grade").innerText=s.grade;
  document.getElementById("st_section").innerText=s.section;

  let tbody=document.getElementById("subjects_table");
  tbody.innerHTML="";

  let total=0,full=0;

  Object.keys(s.subjects||{}).forEach(sub=>{
    let d=s.subjects[sub];
    total+=Number(d.mark)||0;
    full+=Number(d.fullMark)||0;

    let tr=document.createElement("tr");
    tr.innerHTML=
      "<td>"+sub+"</td>"+
      "<td>"+d.fullMark+"</td>"+
      "<td>"+d.mark+"</td>"+
      "<td>"+d.rating+"</td>";
    tbody.appendChild(tr);
  });

  document.getElementById("total_marks").innerText=total+" / "+full;
  document.getElementById("overall_rating").innerText=full ? calcRating(total,full) : "—";
}

</script>

</body>
</html>
