<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نتيجة الطالب - مدارس الفلاح الأهلية</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
body {
    font-family: Calibri;
    background: #f4f4f4;
    margin: 0;
}
.header {
    background: #1976d2;
    color: #fff;
    text-align: center;
    padding: 15px;
}
.header h1 { margin: 0; font-size: 24px; }
.header h2 { margin: 5px 0 0; font-size: 18px; color: #ffeb3b; }

.container {
    max-width: 900px;
    margin: 20px auto;
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

input {
    width: 100%;
    padding: 10px;
    border: 1px solid #999;
    border-radius: 6px;
    font-size: 16px;
}
button {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}
.btn-primary { background: #1976d2; color: #fff; }

.table-title {
    background: #1976d2;
    color: white;
    padding: 8px;
    text-align: center;
    font-weight: bold;
    border-radius: 6px;
    margin-top: 20px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}
th, td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
    font-size: 15px;
}
th {
    background: #1976d2;
    color: #fff;
}

.signature-table {
    width: 100%;
    margin-top: 25px;
    border: 1px solid #ccc;
    border-radius: 6px;
}
.signature-table th {
    background: #1976d2;
}
.signature-table td {
    background: #fafafa;
    font-size: 16px;
    padding: 10px;
}

.notice {
    margin-top: 20px;
    padding: 12px;
    background: #ffdddd;
    color: #b30000;
    border-radius: 6px;
    text-align: center;
    font-size: 16px;
}
</style>
</head>

<body>

<div class="header">
    <h1>مدارس الفلاح الأهلية</h1>
    <h2 id="exam_header">نتيجة الطالب</h2>
</div>

<div class="container">

    <label>أدخل الكود:</label>
    <input id="student_code" placeholder="مثال: 1234">
    <button class="btn-primary" onclick="loadResult()">عرض النتيجة</button>

    <div id="result_area" style="display:none;">

        <h2 id="student_name" style="text-align:center;margin-top:20px;"></h2>

        <div class="table-title" id="exam_type_label">نوع الاختبار</div>

        <!-- جدول المواد -->
        <table id="subjects_table">
            <thead>
                <tr>
                    <th>المادة</th>
                    <th>درجة الطالب</th>
                    <th>الدرجة النهائية</th>
                    <th>التقدير</th>
                </tr>
            </thead>
            <tbody id="subjects_body"></tbody>
        </table>

        <!-- المجموع النهائي -->
        <div class="table-title">المجموع النهائي</div>
        <table>
            <tr>
                <th>المجموع</th>
                <th>التقدير العام</th>
            </tr>
            <tr>
                <td id="total_marks"></td>
                <td id="final_rating"></td>
            </tr>
        </table>

        <!-- توقيع المدير ورئيس الإشراف -->
        <table class="signature-table">
            <tr><th>رئيس قسم الإشراف</th></tr>
            <tr><td id="supervisor_name">—</td></tr>

            <tr><th>مدير المدرسة</th></tr>
            <tr><td id="principal_name">—</td></tr>
        </table>

        <p style="margin-top:10px;text-align:center;font-size:13px;">
            تصميم: محمد عامر أحمد
        </p>

    </div>

    <div id="no_data" class="notice" style="display:none;">
        لم يتم رصد درجات هذا الفصل حتى الآن.
    </div>

</div>

<script>
var firebaseConfig = {
    apiKey:"AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
    authDomain:"all-subjects-14322.firebaseapp.com",
    projectId:"all-subjects-14322",
    storageBucket:"all-subjects-14322.firebasestorage.app",
    messagingSenderId:"813955287168",
    appId:"1:813955287168:web:07efa7dde95b117b9bbe65"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

function calcRating(m, f){
    if(!f || f === 0) return "";
    let p = (m / f) * 100;
    if(p >= 90) return "ممتاز";
    if(p >= 80) return "جيد جدًا";
    if(p >= 70) return "جيد";
    if(p >= 60) return "مقبول";
    return "ضعيف";
}

async function loadResult(){
    let code = document.getElementById("student_code").value.trim();
    if(!code){ alert("أدخل الكود"); return; }

    let doc = await db.collection("students").doc(code).get();
    if(!doc.exists){
        document.getElementById("result_area").style.display="none";
        document.getElementById("no_data").style.display="block";
        return;
    }

    let s = doc.data();
    let subs = s.subjects || {};
    let keys = Object.keys(subs);

    if(keys.length === 0){
        document.getElementById("result_area").style.display="none";
        document.getElementById("no_data").style.display="block";
        return;
    }

    document.getElementById("no_data").style.display="none";
    document.getElementById("result_area").style.display="block";

    // الاسم + الاختبار
    document.getElementById("student_name").innerText = s.name;
    document.getElementById("exam_type_label").innerText = s.examType || "—";
    document.getElementById("exam_header").innerText = "نتيجة الطالب - " + (s.examType || "");

    // تعبئة المواد
    let tbody = document.getElementById("subjects_body");
    tbody.innerHTML = "";

    let total = 0, totalFull = 0;

    keys.forEach(k=>{
        let m = subs[k].mark || 0;
        let f = subs[k].fullMark || 0;

        total += m;
        totalFull += f;

        let tr = document.createElement("tr");
        tr.innerHTML =
            "<td>"+k+"</td>"+
            "<td>"+m+"</td>"+
            "<td>"+f+"</td>"+
            "<td>"+calcRating(m,f)+"</td>";
        tbody.appendChild(tr);
    });

    // مجموع نهائي
    document.getElementById("total_marks").innerText = total + " / " + totalFull;
    document.getElementById("final_rating").innerText = calcRating(total, totalFull);

    // المدير + رئيس الإشراف (قابلة للتعديل لاحقًا لو أردت)
    document.getElementById("supervisor_name").innerText = "رئيس قسم الإشراف";
    document.getElementById("principal_name").innerText = "مدير المدرسة";
}
</script>

</body>
</html>
