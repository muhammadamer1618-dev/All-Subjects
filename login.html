<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تسجيل دخول المعلمين - مدارس الفلاح الأهلية</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<style>
body{font-family:Calibri;background:#f4f4f4;margin:0}
.container{max-width:400px;margin:60px auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 0 10px rgba(0,0,0,0.2);text-align:center}
h1{color:#1976d2;margin-bottom:10px}
label{display:block;margin-top:10px;font-weight:bold}
input{width:100%;padding:10px;font-size:15px;border-radius:8px;border:1px solid #999;box-sizing:border-box;margin-top:5px}
button{margin-top:15px;width:100%;padding:10px;font-size:16px;font-weight:bold;border:none;border-radius:8px;cursor:pointer}
.btn-primary{background:#1976d2;color:#fff}
.info{font-size:13px;color:#555;margin-top:10px}
</style>
</head>
<body>

<div class="container">
  <h1>تسجيل دخول المعلمين</h1>

  <label>البريد الإلكتروني</label>
  <input id="email_input" type="email" placeholder="teacher@example.com">

  <label>كلمة المرور</label>
  <input id="password_input" type="password" placeholder="••••••••">

  <button class="btn-primary" onclick="loginTeacher()">تسجيل الدخول</button>

  <div class="info">
    هذا الدخول خاص بالمعلمين لرصد درجات الفصول المصرح بها لهم فقط.
  </div>
</div>

<script>
var firebaseConfig={
  apiKey:"AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
  authDomain:"all-subjects-14322.firebaseapp.com",
  projectId:"all-subjects-14322",
  storageBucket:"all-subjects-14322.firebasestorage.app",
  messagingSenderId:"813955287168",
  appId:"1:813955287168:web:07efa7dde95b117b9bbe65"
};
firebase.initializeApp(firebaseConfig);
var auth=firebase.auth();

function loginTeacher(){
  var email=document.getElementById("email_input").value.trim();
  var password=document.getElementById("password_input").value;

  if(!email || !password){
    alert("أدخل البريد الإلكتروني وكلمة المرور");
    return;
  }

  auth.signInWithEmailAndPassword(email,password)
    .then(function(){
      location="teacher.html";
    })
    .catch(function(err){
      console.log(err);
      alert("بيانات الدخول غير صحيحة أو لا توجد صلاحيات لهذا الحساب.");
    });
}

auth.onAuthStateChanged(function(user){
  if(user){
    location="teacher.html";
  }
});
</script>

</body>
</html>
