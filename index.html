<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مدارس الفلاح الأهلية - نظام رصد الدرجات</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
body{font-family:Calibri;background:linear-gradient(135deg,#0d47a1,#1976d2);margin:0;display:flex;align-items:center;justify-content:center;height:100vh}
.card{background:#fff;border-radius:14px;box-shadow:0 0 14px rgba(0,0,0,0.3);padding:25px;width:360px;text-align:center}
h1{margin:0 0 5px;color:#0d47a1;font-size:22px}
h2{margin:0 0 20px;color:#d32f2f;font-size:18px}
label{display:block;text-align:right;margin:8px 0 3px;font-weight:bold}
input,select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #999;font-size:15px;box-sizing:border-box}
button{width:100%;margin-top:15px;padding:10px;border:none;border-radius:8px;background:#1976d2;color:#fff;font-size:17px;font-weight:bold;cursor:pointer}
button:hover{opacity:0.9}
.note{margin-top:10px;font-size:12px;color:#555;text-align:right}
.footer{margin-top:15px;font-size:12px;color:#555}
</style>
</head>
<body>

<div class="card">
  <h1>مدارس الفلاح الأهلية</h1>
  <h2>نظام رصد الدرجات</h2>

  <label>البريد الإلكتروني / اسم المستخدم</label>
  <input id="login_username" placeholder="مثال: 20162018 أو 010096">

  <label>كلمة المرور</label>
  <input id="login_password" type="password" placeholder="••••••••">

  <label>نوع الحساب</label>
  <select id="login_role">
    <option value="teacher">معلم</option>
    <option value="supervisor">مشرف</option>
    <option value="admin">مشرف عام</option>
  </select>

  <button onclick="doLogin()">دخول</button>

  <div class="note">
    في حال وجود مشكلة في الدخول، الرجاء مراجعة المشرف العام للنظام.
  </div>

  <div class="footer">
    تصميم محمد عامر أحمد
  </div>
</div>

<script>
var firebaseConfig={
  apiKey:"AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
  authDomain:"all-subjects-14322.firebaseapp.com",
  projectId:"all-subjects-14322",
  storageBucket:"all-subjects-14322.firebasestorage.app",
  messagingSenderId:"813955287168",
  appId:"1:813955287168:web:07efa7dde95b117b9bbe65"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();

async function doLogin(){
  let username=document.getElementById("login_username").value.trim();
  let password=document.getElementById("login_password").value.trim();
  let role=document.getElementById("login_role").value;

  if(!username||!password){alert("أدخل اسم المستخدم وكلمة المرور");return;}

  try{
    let doc=await db.collection("users").doc(username).get();
    if(!doc.exists){alert("الحساب غير موجود");return;}

    let u=doc.data();
    if(u.role!==role){alert("نوع الحساب غير صحيح لهذا المستخدم");return;}
    if(u.password!==password){alert("كلمة المرور غير صحيحة");return;}

    if(role==="admin"){
      location="admin.html?user="+encodeURIComponent(username);
    }else if(role==="teacher"){
      location="teacher.html?user="+encodeURIComponent(username);
    }else{
      location="supervisor.html?user="+encodeURIComponent(username);
    }
  }catch(e){
    console.log(e);
    alert("حدث خطأ أثناء تسجيل الدخول");
  }
}
</script>

</body>
</html>
