<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مدارس الفلاح الأهلية - نظام الدرجات</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  font-family:Calibri;
  background:#f4f4f4;
  margin:0;
  padding:0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.container{
  background:white;
  width:420px;
  padding:25px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 0 12px rgba(0,0,0,0.15);
}
h1{
  color:#1976d2;
  margin-bottom:5px;
}
h2{
  color:#d32f2f;
  margin-top:0;
  margin-bottom:20px;
}
button{
  display:block;
  width:100%;
  padding:12px;
  font-size:18px;
  font-weight:bold;
  margin:10px 0;
  border:none;
  border-radius:8px;
  cursor:pointer;
  color:white;
}
.btn-admin{ background:#1976d2; }
.btn-teacher{ background:#388e3c; }
.btn-student{ background:#d32f2f; }
button:hover{ opacity:0.9; }

.footer{
  margin-top:25px;
  font-size:15px;
  color:#444;
}
.footer img{
  display:block;
  margin:10px auto 0;
  max-width:160px;
  opacity:0.9;
}
</style>

</head>
<body>

<div class="container">
  <h1>مدارس الفلاح الأهلية</h1>
  <h2>نظام رصد الدرجات</h2>

  <button class="btn-admin" onclick="location='admin.html'">دخول المشرف</button>
  <button class="btn-teacher" onclick="location='teacher-login.html'">دخول المعلم</button>
  <button class="btn-student" onclick="location='student.html'">عرض نتيجة الطالب</button>

  <div class="footer">
    تصميم محمد عامر أحمد
    <div id="signature"></div>
  </div>
</div>

<script>
/* لو أرسلت توقيع، سيتم وضعه تلقائيًا */
let savedSig = localStorage.getItem("signature_image");
if(savedSig){
  document.getElementById("signature").innerHTML =
    "<img src='"+savedSig+"' alt='توقيع'>";
}
</script>

</body>
</html>
