<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة المعلم - مدارس الفلاح الأهلية</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Calibri;background:#f4f4f4;margin:0;padding:20px}
.container{max-width:1100px;margin:auto;background:white;padding:20px;border-radius:12px;box-shadow:0 0 10px rgba(0,0,0,0.2)}
h1{text-align:center;color:#1976d2;margin-bottom:5px}
h2{text-align:center;color:#d32f2f;margin-top:0}
label{font-weight:bold}
select,input{padding:8px;font-size:15px;border-radius:6px;border:1px solid #888;width:100%}
table{width:100%;border-collapse:collapse;margin-top:15px;font-size:15px}
th,td{border:1px solid #999;padding:6px;text-align:center}
th{background:#1976d2;color:#fff}
button{padding:10px 15px;font-size:16px;border:none;border-radius:6px;cursor:pointer}
.btn-primary{background:#1976d2;color:white;font-weight:bold}
.btn-danger{background:#d32f2f;color:white;font-weight:bold}
.btn-secondary{background:#757575;color:white;font-weight:bold}
</style>
</head>

<body>

<div class="container">

<h1>لوحة المعلم</h1>
<h2 id="teacher_name">—</h2>

<!-- اختيار الصف والشعبة والمادة -->
<div class="row" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px">
  <div style="flex:1">
    <label>الصف</label>
    <select id="grade_select"></select>
  </div>

  <div style="flex:1">
    <label>الشعبة</label>
    <select id="section_select"></select>
  </div>

  <div style="flex:1">
    <label>المادة</label>
    <select id="subject_select"></select>
  </div>

  <div style="flex:1;display:flex;align-items:flex-end">
    <button class="btn-primary" style="width:100%" onclick="loadStudents()">عرض الطلاب</button>
  </div>
</div>

<!-- جدول رصد الدرجات -->
<table id="marks_table" style="display:none">
  <thead>
    <tr>
      <th>الكود</th>
      <th>اسم الطالب</th>
      <th>الدرجة</th>
      <th>الملاحظة</th>
    </tr>
  </thead>
  <tbody id="marks_body"></tbody>
</table>

<button id="save_btn" class="btn-primary" style="margin-top:15px;display:none" onclick="saveMarks()">حفظ الدرجات</button>

<button id="pdf_btn" class="btn-secondary" style="margin-top:15px;display:none" onclick="exportPDF()">تصدير PDF</button>

</div>


<script>
/* FIREBASE INIT */
var firebaseConfig={
  apiKey:"AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
  authDomain:"all-subjects-14322.firebaseapp.com",
  projectId:"all-subjects-14322",
  storageBucket:"all-subjects-14322.firebasestorage.app",
  messagingSenderId:"813955287168",
  appId:"1:813955287168:web:07efa7dde95b117b9bbe65"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();


/* بيانات المعلم من صفحة الدخول */
var teacherData = JSON.parse(localStorage.getItem("teacherData") || "{}");
document.getElementById("teacher_name").innerText = teacherData.name || "";


/* تحميل الفصول */
function loadTeacherAssignments(){
  let grades = teacherData.grades || [];
  let sections = teacherData.sections || [];
  let subjects = teacherData.subjects || [];

  let gSel=document.getElementById("grade_select");
  let sSel=document.getElementById("section_select");
  let subSel=document.getElementById("subject_select");

  gSel.innerHTML="";
  sSel.innerHTML="";
  subSel.innerHTML="";

  grades.forEach(g=>{
    let o=document.createElement("option");
    o.value=g; o.textContent=g;
    gSel.appendChild(o);
  });

  sections.forEach(sec=>{
    let o=document.createElement("option");
    o.value=sec; o.textContent=sec;
    sSel.appendChild(o);
  });

  subjects.forEach(sub=>{
    let o=document.createElement("option");
    o.value=sub; o.textContent=sub;
    subSel.appendChild(o);
  });
}

loadTeacherAssignments();


/* تحميل الطلاب */
async function loadStudents(){
  let grade=document.getElementById("grade_select").value;
  let section=document.getElementById("section_select").value;
  let subject=document.getElementById("subject_select").value;

  if(!grade || !section || !subject){
    alert("اختر الصف والشعبة والمادة");
    return;
  }

  let tbody=document.getElementById("marks_body");
  tbody.innerHTML="<tr><td colspan='4'>جاري التحميل...</td></tr>";

  let snap=await db.collection("students")
    .where("grade","==",grade)
    .where("section","==",section)
    .get();

  tbody.innerHTML="";
  let show=false;

  snap.forEach(doc=>{
    let s=doc.data();
    show=true;

    let mark = s.subjects && s.subjects[subject] ? (s.subjects[subject].mark||"") : "";
    let note = s.subjects && s.subjects[subject] ? (s.subjects[subject].note||"") : "";

    let tr=document.createElement("tr");
    tr.innerHTML=
      `<td>${s.code}</td>
       <td>${s.name}</td>
       <td><input type="number" data-code="${s.code}" class="mark_in" value="${mark}"></td>
       <td><input type="text" data-code="${s.code}" class="note_in" value="${note}"></td>`;
    tbody.appendChild(tr);
  });

  if(show){
    document.getElementById("marks_table").style.display="table";
    document.getElementById("save_btn").style.display="inline-block";
    document.getElementById("pdf_btn").style.display="inline-block";
  }else{
    alert("لا يوجد طلاب");
  }
}


/* حفظ الدرجات */
async function saveMarks(){
  let subject=document.getElementById("subject_select").value;
  let marks=document.querySelectorAll(".mark_in");
  let notes=document.querySelectorAll(".note_in");

  let batch=db.batch();

  marks.forEach((m,i)=>{
    let code=m.getAttribute("data-code");
    let markVal=m.value.trim();
    let noteVal=notes[i].value.trim();

    let ref=db.collection("students").doc(code);

    batch.set(ref,{
      subjects:{
        [subject]:{
          mark:Number(markVal)||0,
          note:noteVal
        }
      }
    },{merge:true});
  });

  await batch.commit();
  alert("تم حفظ الدرجات");
}


/* PDF */
function exportPDF(){
  let grade=document.getElementById("grade_select").value;
  let section=document.getElementById("section_select").value;
  let subject=document.getElementById("subject_select").value;

  let doc = new jspdf.jsPDF();
  doc.setFontSize(18);
  doc.text("درجات الطلاب - "+subject, 10, 10);

  let rows=[];
  document.querySelectorAll("#marks_body tr").forEach(tr=>{
    let tds=tr.children;
    rows.push([tds[0].innerText, tds[1].innerText, tds[2].children[0].value, tds[3].children[0].value]);
  });

  doc.autoTable({
    head:[["الكود","الاسم","الدرجة","الملاحظة"]],
    body:rows,
    startY:20
  });

  doc.save("marks.pdf");
}

</script>
</body>
</html>
