<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>صفحة المعلم - رصد الدرجات</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
body{font-family:Calibri;background:#f4f4f4;margin:0}
.header{background:#1976d2;color:#fff;text-align:center;padding:15px}
.header h1{margin:0;font-size:24px}
.header h2{margin:5px 0 0;font-size:18px;color:#ffeb3b}
.container{max-width:1100px;margin:20px auto;padding:10px}
.box{background:#fff;border-radius:10px;padding:15px;margin-bottom:15px;box-shadow:0 0 8px rgba(0,0,0,0.1)}
h3{margin-top:0;color:#1976d2}
label{display:block;margin-top:5px}
select,input,button{
  font-family:Calibri;font-size:15px;padding:7px;margin-top:5px;
  border-radius:6px;border:1px solid #999;box-sizing:border-box
}
select,input{width:100%}
button{cursor:pointer;font-weight:bold;border:none}
.btn-primary{background:#1976d2;color:#fff}
.btn-secondary{background:#757575;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px}
.col-3{flex:1 1 23%}
.col-4{flex:1 1 30%}
.col-6{flex:1 1 48%}
.col-12{flex:1 1 100%}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
th,td{border:1px solid #ccc;text-align:center;padding:6px}
th{background:#1976d2;color:#fff}
tr:nth-child(even){background:#f9f9f9}
.small{font-size:13px;color:#555;margin-top:5px}
.badge{display:inline-block;padding:2px 6px;border-radius:10px;font-size:11px;background:#e3f2fd;color:#0d47a1}
</style>
</head>
<body>

<div class="header">
  <h1>مدارس الفلاح الأهلية</h1>
  <h2 id="teacher_header">صفحة المعلم</h2>
</div>

<div class="container">

  <div class="box">
    <h3>الفصل الحالي</h3>
    <div class="row">
      <div class="col-3">
        <label>الصف</label>
        <select id="sel_grade" onchange="updateSectionsAndSubjects()"></select>
      </div>
      <div class="col-3">
        <label>الشعبة</label>
        <select id="sel_section" onchange="updateSubjects()"></select>
      </div>
      <div class="col-3">
        <label>المادة</label>
        <select id="sel_subject"></select>
      </div>
      <div class="col-3" style="display:flex;align-items:flex-end">
        <button class="btn-primary" style="width:100%" onclick="loadClassStudents()">تحميل طلاب الفصل</button>
      </div>
    </div>
    <div class="small">
      المواد النهائية يتم ضبطها من صفحة الإعدادات، والمعلم يقوم فقط بإدخال درجة الطالب.
    </div>
  </div>

  <div class="box">
    <h3>رصد الدرجات</h3>
    <div id="class_info" class="small"></div>
    <table id="marks_table" style="display:none;">
      <thead>
        <tr>
          <th>الكود</th>
          <th>اسم الطالب</th>
          <th>درجة الطالب</th>
          <th>الدرجة النهائية</th>
        </tr>
      </thead>
      <tbody id="marks_body"></tbody>
    </table>
    <button id="save_btn" class="btn-primary" style="margin-top:10px;display:none;" onclick="saveTeacherMarks()">
      حفظ درجات المادة لهذا الفصل
    </button>
  </div>

  <div class="box">
    <button class="btn-secondary" onclick="logoutTeacher()">خروج المعلم</button>
    <button class="btn-secondary" onclick="location='index.html'">الصفحة الرئيسية</button>
  </div>

</div>

<script>
var firebaseConfig={
  apiKey:"AIzaSyC4-cGVb2pHwo6LYiD-UoWtmEEZKQxj4_M",
  authDomain:"all-subjects-14322.firebaseapp.com",
  projectId:"all-subjects-14322",
  storageBucket:"all-subjects-14322.firebasestorage.app",
  messagingSenderId:"813955287168",
  appId:"1:813955287168:web:07efa7dde95b117b9bbe65"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();

var teacherCode="";
var teacherData=null;
var teacherAssignments=[];
var subjectsCacheByGrade={};

function getFullMarkForSubject(grade,subjectName){
  let list=subjectsCacheByGrade[grade]||[];
  for(let i=0;i<list.length;i++){
    if(list[i].name===subjectName){
      return Number(list[i].fullMark)||0;
    }
  }
  return 0;
}

async function loadTeacherData(){
  teacherCode=localStorage.getItem("teacher_code")||"";
  if(!teacherCode){
    location="teacher-login.html";
    return;
  }
  let doc=await db.collection("teachers").doc(teacherCode).get();
  if(!doc.exists){
    alert("بيانات المعلم غير موجودة، راجع المشرف.");
    localStorage.removeItem("teacher_code");
    location="teacher-login.html";
    return;
  }
  teacherData=doc.data();
  teacherAssignments=(teacherData.assignments||[]);

  document.getElementById("teacher_header").innerText=
    "صفحة المعلم: "+(teacherData.name||teacherCode);

  initSelectorsFromAssignments();
}

function initSelectorsFromAssignments(){
  let selGrade=document.getElementById("sel_grade");
  let selSection=document.getElementById("sel_section");
  let selSubject=document.getElementById("sel_subject");

  selGrade.innerHTML="";
  selSection.innerHTML="";
  selSubject.innerHTML="";

  if(!teacherAssignments.length){
    let o=document.createElement("option");
    o.textContent="لا توجد فصول مسندة"; o.value="";
    selGrade.appendChild(o);
    return;
  }

  let grades=[...new Set(teacherAssignments.map(a=>a.grade))];
  grades.forEach(g=>{
    let o=document.createElement("option");
    o.value=g; o.textContent=g;
    selGrade.appendChild(o);
  });

  updateSectionsAndSubjects();
}

function updateSectionsAndSubjects(){
  let selGrade=document.getElementById("sel_grade");
  let grade=selGrade.value;
  let selSection=document.getElementById("sel_section");
  let selSubject=document.getElementById("sel_subject");
  selSection.innerHTML="";
  selSubject.innerHTML="";

  if(!grade)return;

  let sections=[...new Set(teacherAssignments
    .filter(a=>a.grade===grade)
    .map(a=>a.section)
  )];

  sections.forEach(s=>{
    let o=document.createElement("option");
    o.value=s; o.textContent=s;
    selSection.appendChild(o);
  });

  updateSubjects();
}

function updateSubjects(){
  let grade=document.getElementById("sel_grade").value;
  let section=document.getElementById("sel_section").value;
  let selSubject=document.getElementById("sel_subject");
  selSubject.innerHTML="";
  if(!grade || !section)return;

  let subs=[...new Set(teacherAssignments
    .filter(a=>a.grade===grade && a.section===section)
    .map(a=>a.subject)
  )];

  subs.forEach(s=>{
    let o=document.createElement("option");
    o.value=s; o.textContent=s;
    selSubject.appendChild(o);
  });
}

async function loadClassStudents(){
  let grade=document.getElementById("sel_grade").value;
  let section=document.getElementById("sel_section").value;
  let subject=document.getElementById("sel_subject").value;

  if(!grade || !section || !subject){
    alert("اختر الصف والشعبة والمادة أولاً");
    return;
  }

  if(!teacherAssignments.some(a=>a.grade===grade && a.section===section && a.subject===subject)){
    alert("هذه المادة/الصف/الشعبة غير مسندة لك");
    return;
  }

  if(!subjectsCacheByGrade[grade]){
    let doc=await db.collection("settings").doc("subjects_"+grade).get();
    if(doc.exists){
      subjectsCacheByGrade[grade]=doc.data().subjects||[];
    }else{
      subjectsCacheByGrade[grade]=[];
    }
  }

  let fullMark=getFullMarkForSubject(grade,subject);
  if(!fullMark){
    alert("لم يتم العثور على هذه المادة في إعدادات الصف. تأكد من اسم المادة في صفحة الإعدادات.");
    return;
  }

  let snap=await db.collection("students")
    .where("grade","==",grade)
    .where("section","==",section)
    .get();

  let body=document.getElementById("marks_body");
  body.innerHTML="";
  let table=document.getElementById("marks_table");
  let saveBtn=document.getElementById("save_btn");

  if(snap.empty){
    table.style.display="none";
    saveBtn.style.display="none";
    document.getElementById("class_info").innerText="لا يوجد طلاب لهذا الفصل.";
    return;
  }

  let students=[];
  snap.forEach(doc=>students.push(doc.data()));
  students.sort((a,b)=>(a.name||"").localeCompare(b.name||"","ar"));

  students.forEach(st=>{
    let existing=st.subjects && st.subjects[subject];
    let mark=existing ? (existing.mark||"") : "";
    let tr=document.createElement("tr");
    tr.innerHTML=
      "<td>"+(st.code||"")+"</td>"+
      "<td>"+(st.name||"")+"</td>"+
      "<td><input type='number' class='t-mark' data-code='"+(st.code||"")+"' data-subject='"+subject+"' data-grade='"+grade+"' data-full='"+fullMark+"' style='width:80px' value='"+mark+"'></td>"+
      "<td>"+fullMark+"</td>";
    body.appendChild(tr);
  });

  table.style.display="table";
  saveBtn.style.display="inline-block";
  document.getElementById("class_info").innerHTML=
    "الصف: <span class='badge'>"+grade+"</span> | الشعبة: <span class='badge'>"+section+
    "</span> | المادة: <span class='badge'>"+subject+"</span> | الدرجة النهائية: <span class='badge'>"+fullMark+"</span>";
}

async function saveTeacherMarks(){
  let inputs=document.querySelectorAll(".t-mark");
  if(!inputs.length){
    alert("لا توجد درجات لإدخالها");
    return;
  }

  let updates={};

  inputs.forEach(inp=>{
    let code=inp.getAttribute("data-code");
    let subject=inp.getAttribute("data-subject");
    let grade=inp.getAttribute("data-grade");
    let full=Number(inp.getAttribute("data-full"))||0;
    let markVal=inp.value.trim();
    let mark=markVal==="" ? 0 : Number(markVal);
    if(!code || !subject || !grade)return;

    if(!updates[code])updates[code]=[];
    updates[code].push({subject:subject,full:full,mark:mark});
  });

  let batch=db.batch();
  let snap=await db.collection("students")
    .where("grade","==",inputs[0].getAttribute("data-grade"))
    .get();

  let studentsByCode={};
  snap.forEach(doc=>studentsByCode[doc.id]=doc);

  Object.keys(updates).forEach(code=>{
    let docRef=db.collection("students").doc(code);
    let doc=studentsByCode[code];
    let data=doc && doc.data ? doc.data() : null;
    let subjects=data && data.subjects ? Object.assign({}, data.subjects) : {};
    updates[code].forEach(u=>{
      subjects[u.subject]={fullMark:u.full,mark:u.mark};
    });
    batch.set(docRef,{subjects:subjects},{merge:true});
  });

  await batch.commit();
  alert("تم حفظ درجات المادة لهذا الفصل");
}

function logoutTeacher(){
  localStorage.removeItem("teacher_code");
  location="teacher-login.html";
}

loadTeacherData();
</script>

</body>
</html>
